   賞状 / 本人用レポート / 親用レポート の 3つが ぜんぶ ここを 見る。
   🔴 ふりかえりの「1回目・2回目」は 保存されていないので 出さない。
      （reflectionReply は その日の 最後の コメントだけ）
   ===================================================================== */

/* ---- 小さな道具 ---------------------------------------------------- */
function fnRange(s,e){ const a=[]; let d=parseYmd(s); const z=parseYmd(e);
  while(d<=z){ a.push(ymd(d)); d=addDays(d,1); } return a; }
function fnAvg(a){ const v=a.filter(x=>typeof x==='number'&&!isNaN(x)); return v.length? v.reduce((s,x)=>s+x,0)/v.length : 0; }
function fnSum(a){ return a.reduce((s,x)=>s+(Number(x)||0),0); }
function fnMed(a){ const v=a.slice().sort((x,y)=>x-y); if(!v.length) return 0;
  const m=v.length>>1; return v.length%2? v[m] : (v[m-1]+v[m])/2; }
function fnMA(arr,w){                       /* 中央ぞろえの ならし（はしは あるぶんだけ） */
  const out=[], h=(w-1)>>1;
  for(let i=0;i<arr.length;i++){
    let s=0,n=0;
    for(let j=i-h;j<=i+h;j++){ if(j<0||j>=arr.length) continue; const v=arr[j]; if(v==null) continue; s+=v; n++; }
    out.push(n? Math.round(s/n*10)/10 : null);
  }
  return out;
}
/* かたむき（最小二乗）＝1日あたり どれだけ 伸びたか。null は とばす */
function fnSlope(pairs){
  const p=pairs.filter(o=>o[1]!=null&&!isNaN(o[1]));
  const n=p.length; if(n<3) return null;
  const mx=fnAvg(p.map(o=>o[0])), my=fnAvg(p.map(o=>o[1]));
  let num=0, den=0;
  p.forEach(o=>{ num+=(o[0]-mx)*(o[1]-my); den+=(o[0]-mx)*(o[0]-mx); });
  return den? num/den : null;
}
/* 相関（ピアソン）。どちらも 値が ある日だけ。3日未満なら null */
function fnCorr(xs,ys){
  const p=[]; for(let i=0;i<xs.length;i++){ if(xs[i]==null||ys[i]==null) continue; p.push([xs[i],ys[i]]); }
  if(p.length<5) return null;
  const mx=fnAvg(p.map(o=>o[0])), my=fnAvg(p.map(o=>o[1]));
  let n=0,dx=0,dy=0;
  p.forEach(o=>{ n+=(o[0]-mx)*(o[1]-my); dx+=(o[0]-mx)**2; dy+=(o[1]-my)**2; });
  if(dx<=0||dy<=0) return null;
  return { r: n/Math.sqrt(dx*dy), n: p.length };
}
const FN_KANJI = /[一-鿿々]/;
function fnChars(s){ return [...String(s||'')]; }
function fnKanjiKinds(s){ const set=new Set(); fnChars(s).forEach(c=>{ if(FN_KANJI.test(c)) set.add(c); }); return set; }
function fnSentences(s){
  return String(s||'').split(/[。．！？!?\n]+/).map(x=>x.trim()).filter(Boolean);
}

/* =====================================================================
   記録のなおし（単位ちがい）
   ---------------------------------------------------------------------
   🔴 じっさいに あった こと：
      「研究の下調べ 30分」を、ページ数の らんに 30 と 入れてしまった日が ある。
      すると その日だけ 山が つきぬけて、7日ならしも 前半/後半の 比べも 全部 ずれる。
   🔴 元の 記録は ぜったいに 書きかえない。集計する ときだけ 読みかえる。
      そして「なおした」ことを レポートに かならず 書く（だまって 直すのが いちばん まずい）。
   かたち： CONFIG.fixes = [{ d:'2026-07-29', n:'らくらくノート', v:2, note:'30分を ページに 読みかえ' }]
      v が null なら その行は 集計から 外す。
   ===================================================================== */
function fixKey(d,n){ return d + '\u0000' + n; }
function fixMap(config){
  const m = new Map();
  ((config&&config.fixes)||[]).forEach(f=>{
    if(!f || !f.d || !f.n) return;
    m.set(fixKey(f.d, f.n), f);
  });
  return m;
}
/* まん中の 値（0は かぞえない）。ふだんの 1日ぶんの 目安 */
function fnMedPos(a){ const v=a.filter(x=>typeof x==='number'&&x>0); return v.length? fnMed(v):0; }

/* =====================================================================
   本体
   ===================================================================== */
function finaleStats(reports, config){
  const R = reports || {};
  const C = config || {};
  const start = C.vacStart, end = C.vacEnd;
  const all = fnRange(start, end);
  const has = d => !!R[d];
  const recDates = all.filter(has);

  /* ---------- ① つづけた（継続） ----------
     🔴 「はじめた日」より前は 抜けあつかいに しない。
        （7/21から の 夏休みでも、記録を 7/23に 始めたなら 数えるのは そこから） */
  const firstRec = recDates[0] || '';
  const span = firstRec ? all.filter(d=>d>=firstRec) : [];
  let streakMax=0, cur=0, streakEndAt='';
  span.forEach(d=>{ if(has(d)){ cur++; if(cur>streakMax){streakMax=cur; streakEndAt=d;} } else cur=0; });
  let streakNow=0;
  for(let i=span.length-1;i>=0;i--){ if(has(span[i])) streakNow++; else break; }
  const missing = span.filter(d=>!has(d));
  const beforeStart = firstRec ? all.filter(d=>d<firstRec).length : 0;

  /* ---------- ② 日ごとの 生の数 ---------- */
  const FIXES = fixMap(C);
  const fixedList = [];
  const rows = all.map(d=>{
    const r = R[d];
    if(!r) return { date:d, rec:false, study:0, studyItems:[], studyRaw:[], ex:0, pool:0, move:0,
                    game:0, anime:0, screen:0, type:null, narai:0, chars:0, sent:0, kanji:new Set(), hour:null };
    const studyRaw=(r.study||[]).map(s=>({name:String(s.name||''), n:Number(s.pages)||0, unit:String(s.unit||'')}));
    /* 記録の なおしを あてる（元は さわらない） */
    const studyItems=[];
    studyRaw.forEach(it=>{
      const f = FIXES.get(fixKey(d, it.name));
      if(!f){ studyItems.push(it); return; }
      if(f.v==null){ fixedList.push({date:d, name:it.name, from:it.n, to:null, note:f.note||''}); return; }
      const nv = Number(f.v)||0;
      fixedList.push({date:d, name:it.name, from:it.n, to:nv, note:f.note||''});
      studyItems.push({name:it.name, n:nv, unit:it.unit});
    });
    const ex=sumMin(exArr(r)), pool=poolMin(r);
    const game=sumMin(playArr(r)), anime=sumMin(animeArr(r));
    const ref=String(r.reflection||'');
    let hour=null;
    if(r.updatedAt){ const t=new Date(r.updatedAt); if(!isNaN(t)) hour = t.getHours() + t.getMinutes()/60; }
    const tScore = (r.typing && r.typing.score!=='' && r.typing.score!=null) ? Number(r.typing.score) : null;
    return { date:d, rec:true,
             study:fnSum(studyItems.map(s=>s.n)), studyItems, studyRaw,
             ex, pool, move:ex+pool, game, anime, screen:game+anime,
             type:(tScore!=null && !isNaN(tScore))?tScore:null,
             narai:(r.narai&&String(r.narai.text||'').trim())?1:0,
             chars:fnChars(ref).length, sent:fnSentences(ref).length,
             kanji:fnKanjiKinds(ref), text:ref, hour };
  });
  const recRows = rows.filter(o=>o.rec);
  const half = Math.ceil(recRows.length/2);
  const H1 = recRows.slice(0,half), H2 = recRows.slice(half);
  const cmp = (key)=>{
    const a=fnAvg(H1.map(o=>o[key])), b=fnAvg(H2.map(o=>o[key]));
    return { first:Math.round(a*10)/10, second:Math.round(b*10)/10,
             diff:Math.round((b-a)*10)/10,
             pct: a>0 ? Math.round((b-a)/a*100) : null };
  };

  /* ---------- ③ やること別 ---------- */
  const goals = (C.goals||[]);
  const nameSet = new Set();
  recRows.forEach(o=>o.studyItems.forEach(s=>{ if(s.name) nameSet.add(s.name); }));
  goals.forEach(g=>{ if(g && g.name) nameSet.add(g.name); });
  const byName = [...nameSet].map(name=>{
    const g = goals.find(x=>x&&x.name===name) || {};
    const daily = rows.map(o=> o.rec ? fnSum(o.studyItems.filter(s=>s.name===name).map(s=>s.n)) : null );
    const done  = fnSum(daily.map(v=>v||0));
    const days  = daily.filter(v=>v>0).length;
    const goalTotal = (g.total!=='' && g.total!=null && Number(g.total)>0) ? Number(g.total) : null;
    const unit = g.unit || (recRows.flatMap(o=>o.studyItems).find(s=>s.name===name&&s.unit)||{}).unit || '';
    const dv = daily.filter(v=>v!=null);
    const dh = Math.ceil(dv.length/2);
    const pace1 = fnAvg(dv.slice(0,dh)), pace2 = fnAvg(dv.slice(dh));
    return { name, unit, done, days,
             rate: recRows.length? Math.round(days/recRows.length*100) : 0,
             goalTotal, pct: goalTotal? Math.min(999,Math.round(done/goalTotal*100)) : null,
             left: goalTotal? Math.max(0, goalTotal-done) : null,
             daily,
             pace:{ first:Math.round(pace1*10)/10, second:Math.round(pace2*10)/10,
                    pct: pace1>0? Math.round((pace2-pace1)/pace1*100) : null },
             desc: g.desc||'', emoji: g.emoji||'📖' };
  }).sort((a,b)=> (b.done||0)-(a.done||0));

  /* ---------- ③b 単位ちがい さがし ----------
     やること別の「ふだんの 1日ぶん」（0を のぞいた 中央値）から 大きく はなれた日を ひろう。
     🔴 かってに 直さない。候補として 出すだけ。直すのは 人（設定画面）。 */
  const suspects = [];
  {
    const byNameRaw = new Map();
    recRows.forEach(o=>o.studyRaw.forEach(it=>{
      if(!it.name) return;
      if(!byNameRaw.has(it.name)) byNameRaw.set(it.name, []);
      byNameRaw.get(it.name).push({date:o.date, n:it.n, unit:it.unit});
    }));
    /* 🔴 1〜2回しか 出てこない やること（例：自由研究の 下調べ）は
          自分の 中央値と くらべても 意味が ない（その値 自身が 中央値に なる）。
          そういう ときは **ほかの やること ぜんぶの 中央値**と くらべる。 */
    const allVals = [];
    recRows.forEach(o=>o.studyRaw.forEach(it=>{ if(it.n>0) allVals.push(it.n); }));
    const globalMed = fnMedPos(allVals);
    byNameRaw.forEach((list,name)=>{
      const own = fnMedPos(list.map(x=>x.n));
      const enough = (list.length >= 4 && own > 0);
      const med = enough ? own : (globalMed || own);
      const basis = enough ? 'own' : 'all';
      if(med<=0) return;
      list.forEach(x=>{
        if(FIXES.has(fixKey(x.date,name))) return;          /* もう 直してある */
        if(x.n < 10) return;                                /* 小さい数は そもそも あやしくない */
        if(x.n < med*5) return;                             /* ふだんの 5ばい 未満は 見のがす */
        suspects.push({ date:x.date, name, value:x.n,
                        median: Math.round(med*10)/10, basis, unit:x.unit||'',
                        days: list.length,
                        suggest: Math.max(1, Math.round(med)),
                        share: (function(){ const tot=fnSum(list.map(y=>y.n)); return tot? Math.round(x.n/tot*100):0; })() });
      });
    });
    suspects.sort((a,b)=> b.value/b.median - a.value/a.median);
  }

  /* ---------- ④ 曜日のムラ ---------- */
  const wk = [0,1,2,3,4,5,6].map(w=>{
    const t = recRows.filter(o=> parseYmd(o.date).getDay()===w );
    return { w, label:WEEK[w], n:t.length,
             study:Math.round(fnAvg(t.map(o=>o.study))*10)/10,
             move: Math.round(fnAvg(t.map(o=>o.move))),
             screen:Math.round(fnAvg(t.map(o=>o.screen))),
             chars:Math.round(fnAvg(t.map(o=>o.chars))) };
  });

  /* ---------- ⑤ タイピング ---------- */
  const tp = rows.map((o,i)=>[i,o.type]);
  const tvals = rows.map(o=>o.type).filter(v=>v!=null);
  const typing = {
    count:tvals.length,
    first:tvals.length?tvals[0]:null,
    best:tvals.length?Math.max(...tvals):null,
    last:tvals.length?tvals[tvals.length-1]:null,
    avg:Math.round(fnAvg(tvals)),
    slope:(()=>{ const s=fnSlope(tp); return s==null?null:Math.round(s*100)/100; })(),
    gainPct:(tvals.length>=2 && tvals[0]>0)? Math.round((Math.max(...tvals)-tvals[0])/tvals[0]*100) : null,
    daily: rows.map(o=>o.type)
  };

  /* ---------- ⑥ からだ（運動・プール） ---------- */
  let gapMax=0, gapCur=0;
  recRows.forEach(o=>{ if(o.move>0){ gapCur=0; } else { gapCur++; if(gapCur>gapMax) gapMax=gapCur; } });
  /* 🔴 プールに 入らない日は ほとんど 天気（8月は 雨が 多い）。
        「プール0＝運動していない」と 読ませない ために、うんどうだけの 数も 出す。 */
  let exGapMax=0, exGapCur=0;
  recRows.forEach(o=>{ if(o.ex>0){ exGapCur=0; } else { exGapCur++; if(exGapCur>exGapMax) exGapMax=exGapCur; } });
  const move = {
    exMin:fnSum(recRows.map(o=>o.ex)), poolMin:fnSum(recRows.map(o=>o.pool)),
    exDays:recRows.filter(o=>o.ex>0).length, poolDays:recRows.filter(o=>o.pool>0).length,
    activeDays:recRows.filter(o=>o.move>0).length,
    activeRate: recRows.length? Math.round(recRows.filter(o=>o.move>0).length/recRows.length*100) : 0,
    exRate: recRows.length? Math.round(recRows.filter(o=>o.ex>0).length/recRows.length*100) : 0,
    poolRate: recRows.length? Math.round(recRows.filter(o=>o.pool>0).length/recRows.length*100) : 0,
    longestGap:gapMax, exGap:exGapMax,
    /* 月ごとの プール（天気の うつりかわりを 見るため） */
    poolByMonth:(function(){ const m={}; recRows.forEach(o=>{ const k=o.date.slice(0,7);
      if(!m[k]) m[k]={n:0,days:0,min:0}; m[k].n++; if(o.pool>0){ m[k].days++; m[k].min+=o.pool; } });
      return Object.keys(m).sort().map(k=>({ month:k, days:m[k].days, of:m[k].n, min:m[k].min,
        rate: m[k].n? Math.round(m[k].days/m[k].n*100):0 })); })(),
    avg:Math.round(fnAvg(recRows.map(o=>o.move))),
    cmp:cmp('move'),
    daily: rows.map(o=>o.rec?o.move:null),
    dailyEx: rows.map(o=>o.rec?o.ex:null),
    dailyPool: rows.map(o=>o.rec?o.pool:null)
  };

  /* ---------- ⑦ 画面の時間 と 勉強 ---------- */
  const screen = {
    gameMin:fnSum(recRows.map(o=>o.game)), animeMin:fnSum(recRows.map(o=>o.anime)),
    total:fnSum(recRows.map(o=>o.screen)),
    avg:Math.round(fnAvg(recRows.map(o=>o.screen))),
    cmp:cmp('screen'),
    daily: rows.map(o=>o.rec?o.screen:null),
    dailyGame: rows.map(o=>o.rec?o.game:null),
    dailyAnime: rows.map(o=>o.rec?o.anime:null),
    corrStudy: fnCorr(rows.map(o=>o.rec?o.screen:null), rows.map(o=>o.rec?o.study:null)),
    corrMove:  fnCorr(rows.map(o=>o.rec?o.screen:null), rows.map(o=>o.rec?o.move:null)),
    /* 多い日／少ない日 で 勉強量が どう ちがうか（相関より 読みやすい） */
    split:(()=>{
      const v=recRows.filter(o=>o.screen>0).map(o=>o.screen);
      if(v.length<6) return null;
      const md=fnMed(v);
      const hi=recRows.filter(o=>o.screen> md), lo=recRows.filter(o=>o.screen<=md);
      return { median:Math.round(md),
               hiStudy:Math.round(fnAvg(hi.map(o=>o.study))*10)/10, hiN:hi.length,
               loStudy:Math.round(fnAvg(lo.map(o=>o.study))*10)/10, loN:lo.length };
    })()
  };

  /* ---------- ⑧ 作文 ---------- */
  const wrote = recRows.filter(o=>o.chars>0);
  const kanjiAll = new Set(); recRows.forEach(o=>o.kanji.forEach(c=>kanjiAll.add(c)));
  const kanjiH1 = new Set(); H1.forEach(o=>o.kanji.forEach(c=>kanjiH1.add(c)));
  const kanjiH2 = new Set(); H2.forEach(o=>o.kanji.forEach(c=>kanjiH2.add(c)));
  const best = wrote.slice().sort((a,b)=>b.chars-a.chars)[0] || null;
  const writing = {
    days:wrote.length,
    totalChars:fnSum(recRows.map(o=>o.chars)),
    avg:Math.round(fnAvg(wrote.map(o=>o.chars))),
    max: best? best.chars : 0, maxDate: best? best.date : '',
    min: wrote.length? Math.min(...wrote.map(o=>o.chars)) : 0,
    cmp:cmp('chars'),
    slope:(()=>{ const s=fnSlope(rows.map((o,i)=>[i, o.rec&&o.chars>0?o.chars:null])); return s==null?null:Math.round(s*100)/100; })(),
    sentAvg: Math.round(fnAvg(wrote.map(o=>o.sent? o.chars/o.sent : 0))*10)/10,
    sentCmp: (()=>{ const f=fnAvg(H1.filter(o=>o.sent).map(o=>o.sent)), s=fnAvg(H2.filter(o=>o.sent).map(o=>o.sent));
                    return { first:Math.round(f*10)/10, second:Math.round(s*10)/10 }; })(),
    kanjiKinds:kanjiAll.size, kanjiFirst:kanjiH1.size, kanjiSecond:kanjiH2.size,
    kanjiList:[...kanjiAll],
    shortDays: wrote.filter(o=>o.chars<20).length,     /* みじかい日（20字未満） */
    longDays:  wrote.filter(o=>o.chars>=60).length,
    daily: rows.map(o=>o.rec?o.chars:null),
    ma7: fnMA(rows.map(o=>o.rec?o.chars:null),7),
    top5: wrote.slice().sort((a,b)=>b.chars-a.chars).slice(0,5).map(o=>({date:o.date,chars:o.chars,text:o.text}))
  };

  /* ---------- ⑨ 記録した時刻（生活リズム） ---------- */
  const hrs = recRows.map(o=>o.hour).filter(v=>v!=null);
  const clock = {
    n:hrs.length,
    median:hrs.length? Math.round(fnMed(hrs)*10)/10 : null,
    first: H1.map(o=>o.hour).filter(v=>v!=null).length? Math.round(fnMed(H1.map(o=>o.hour).filter(v=>v!=null))*10)/10 : null,
    second:H2.map(o=>o.hour).filter(v=>v!=null).length? Math.round(fnMed(H2.map(o=>o.hour).filter(v=>v!=null))*10)/10 : null,
    lateDays: hrs.filter(h=>h>=21).length,
    earlyDays: hrs.filter(h=>h<16).length,
    hist:(()=>{ const a=new Array(24).fill(0); hrs.forEach(h=>a[Math.floor(h)]++); return a; })(),
    daily: rows.map(o=>o.rec?o.hour:null)
  };

  /* ---------- ⑩ 勉強量の推移 ---------- */
  const study = {
    total:fnSum(recRows.map(o=>o.study)),
    avg:Math.round(fnAvg(recRows.map(o=>o.study))*10)/10,
    zeroDays:recRows.filter(o=>o.study<=0).length,
    daily: rows.map(o=>o.rec?o.study:null),
    ma7: fnMA(rows.map(o=>o.rec?o.study:null),7),
    cum:(()=>{ let s=0; return rows.map(o=>{ if(o.rec) s+=o.study; return s; }); })(),
    cmp:cmp('study'),
    slope:(()=>{ const s=fnSlope(rows.map((o,i)=>[i,o.rec?o.study:null])); return s==null?null:Math.round(s*100)/100; })(),
    byName
  };

  const out = {
    range:{ start, end, totalDays:all.length, dates:all,
            labels: all.map(d=>{ const t=parseYmd(d); return (t.getMonth()+1)+'/'+t.getDate(); }) },
    days:{ recorded:recRows.length, spanDays:span.length,
           rate: span.length? Math.round(recRows.length/span.length*100):0,
           first:recDates[0]||'', last:recDates[recDates.length-1]||'',
           beforeStart,
           streakMax, streakEndAt, streakNow, missing, missingN:missing.length },
    fixes:{ applied:fixedList, n:fixedList.length, suspects, suspectN:suspects.length },
    rows, study, typing, move, screen, writing, clock, weekday:wk,
    narai:{ days:recRows.filter(o=>o.narai).length },
    _half:{ n1:H1.length, n2:H2.length,
            d1:[H1[0]&&H1[0].date, H1[H1.length-1]&&H1[H1.length-1].date],
            d2:[H2[0]&&H2[0].date, H2[H2.length-1]&&H2[H2.length-1].date] }
  };
  out.findings = finaleFindings(out);
  return out;
}

/* =====================================================================
   気づき（ルールで 出す。AIとは 別に、数字だけで 言えることを 先に出す）
   level: 'good' ほめる / 'watch' 気に なる / 'info' 見かた
   ===================================================================== */
function finaleFindings(S){
  const F=[];
  const add=(level,title,body,how)=>F.push({level,title,body,how:how||''});
  /* pin ＝ 数字の 前提が 変わる 話。紙が 足りなくても ぜったいに 落とさない */
  const pin=(level,title,body,how)=>F.push({level,title,body,how:how||'',pin:true});
  const md = d => d? (parseYmd(d).getMonth()+1)+'月'+parseYmd(d).getDate()+'日' : '';

  /* 記録の なおし・単位ちがい（いちばん 先に 出す。数字の 前提が 変わるので） */
  if(S.fixes && S.fixes.n) pin('info','集計のときに 読みかえた記録があります',
    S.fixes.applied.map(f=>`${md(f.date)} ${f.name}：${f.from} → ${f.to==null?'集計から除外':f.to}${f.note?`（${f.note}）`:''}`).join('　'),
    '元の記録は書きかえていません。集計するときだけ読みかえています。');
  if(S.fixes && S.fixes.suspectN) pin('watch','単位がちがう入力かもしれない記録があります',
    S.fixes.suspects.slice(0,3).map(x=>`${md(x.date)} ${x.name}：${x.value}${x.unit}`
      + `（${x.basis==='own' ? 'この教材のふだんは '+x.median+x.unit : 'ほかの教材はふだん '+x.median+x.unit+'・この教材は'+x.days+'日だけの記録'}）`).join('　')
    + (S.fixes.suspectN>3?` ほか${S.fixes.suspectN-3}件`:''),
    'たとえば「30分」を ページ数のらんに 30と入力すると、その日だけ極端に大きくなり、推移のグラフも前半・後半の比較もずれます。'
    + '設定画面の「記録のなおし」で読みかえを登録すると、この数字を正しく直せます。');

  /* 継続 */
  if(S.days.rate>=95) add('good','記録がほぼ切れていない',
    `${S.days.first?md(S.days.first)+'から ':''}${S.days.spanDays}日のうち${S.days.recorded}日（${S.days.rate}%）。最長で${S.days.streakMax}日連続。`,
    '毎日の記録そのものが習慣化の証拠。中身の量より、まずここが続いたことを評価してよい所です。');
  else if(S.days.missingN>0) add('watch','記録が抜けた日がある',
    `${S.days.missingN}日ぶん記録がありません（${S.days.missing.slice(0,5).map(md).join('・')}${S.days.missingN>5?' ほか':''}）。`,
    '抜けた日が連続しているなら「行事・旅行」など外的要因、散っているなら「面倒になる時間帯」がある可能性。');

  /* 勉強量の前後半 */
  const sc=S.study.cmp;
  if(sc.pct!=null && sc.pct<=-25) add('watch','後半で学習量が落ちている',
    `1日あたり 前半${sc.first} → 後半${sc.second}（${sc.pct}%）。`,
    '「宿題が終わった」のか「息切れ」なのかで対応が変わります。下のやること別の表で、どの教材が止まったかを見てください。');
  else if(sc.pct!=null && sc.pct>=20) add('good','後半のほうが学習量が多い',
    `1日あたり 前半${sc.first} → 後半${sc.second}（+${sc.pct}%）。`,
    '終盤に伸びるのは珍しい形。ペースを自分で上げられた、と見てよいです。');

  /* やること別・未達 */
  (S.study.byName||[]).forEach(g=>{
    if(g.goalTotal==null) return;
    if(g.pct>=100) add('good',`${g.name} は目標を達成`,
      `${g.done}/${g.goalTotal}${g.unit}（${g.pct}%）。取り組んだ日数 ${g.days}日。`,'');
    else if(g.pct<70) add('watch',`${g.name} が目標に届いていない`,
      `${g.done}/${g.goalTotal}${g.unit}（${g.pct}%・残り${g.left}${g.unit}）。取り組んだ日は ${g.days}日／${S.days.recorded}日。`,
      g.pace.pct!=null && g.pace.pct<=-30
        ? `後半に失速しています（1日 ${g.pace.first}→${g.pace.second}${g.unit}）。量より「触らない日」が増えたことが原因の形です。`
        : '「1日の量が足りない」のか「やらない日が多い」のかは、取り組んだ日数で見分けられます。');
    else if(g.pace.pct!=null && g.pace.pct<=-40) add('watch',`${g.name} は達成したがペースが落ちた`,
      `1日 ${g.pace.first}→${g.pace.second}${g.unit}（${g.pace.pct}%）。`,'');
  });

  /* からだ　🔴 プールに 入らない日は ほとんど 天気。運動不足と 読ませない */
  const POOL_NOTE = 'プールは天候に左右されます。入らなかった日＝運動していない日 ではありません。';
  if(S.move.activeRate>=80) add('good','体を動かさない日がほとんどない',
    `${S.move.activeDays}日／${S.days.recorded}日（${S.move.activeRate}%）。うんどう ${S.move.exDays}日（${S.move.exRate}%）・プール ${S.move.poolDays}日（${S.move.poolRate}%）。`,
    POOL_NOTE);
  else if(S.move.activeRate<50) add('watch','体を動かした日が半分を切る',
    `${S.move.activeDays}日／${S.days.recorded}日（${S.move.activeRate}%）。うんどう ${S.move.exRate}%・プール ${S.move.poolRate}%。どちらも0の日が最長 ${S.move.longestGap}日。`,
    POOL_NOTE + ' プールを外した「うんどう」だけで見て、それでも少ないかどうかを確認してください。暑さで外に出られない時期もあります。');
  if(S.move.cmp.pct!=null && S.move.cmp.pct<=-40) add('watch','後半になって体を動かす時間が減った',
    `1日あたり ${S.move.cmp.first}分 → ${S.move.cmp.second}分。`,
    POOL_NOTE + ' 8月は雨天が続くとプールが丸ごと落ちるので、この減りは天候のぶんを含みます。うんどうだけの推移（3ページ目のグラフの緑）で見直してください。');
  /* 月ごとの プール＝ほぼ 天気の 記録 */
  if((S.move.poolByMonth||[]).length>=2){
    const pm=S.move.poolByMonth;
    const t=pm.map(m=>`${Number(m.month.slice(5))}月 ${m.days}日／${m.of}日（${m.rate}%）`).join('　');
    const drop = pm[pm.length-1].rate < pm[0].rate - 25;
    if(drop) add('info','プールの日数は 月で 大きく変わった',
      `${t}。`,
      'プールは天気しだいなので、この差は本人の意欲ではなく 天候の記録として見てください。'
      + '雨の日が続いた月は、その分だけ「動いた時間」の合計も下がります。');
  }

  /* 画面 */
  if(S.screen.split){
    const sp=S.screen.split, d=Math.round((sp.loStudy-sp.hiStudy)*10)/10;
    if(d>0 && sp.loStudy>0 && (d/sp.loStudy)>=0.2)
      add('watch','画面の時間が長い日は 学習量が落ちている',
        `ゲーム・アニメが ${sp.median}分より 長い日（${sp.hiN}日）の学習量は 平均${sp.hiStudy}、短い日（${sp.loN}日）は 平均${sp.loStudy}。`,
        '「ゲームをやめさせる」より「先に勉強を終える順番にする」ほうが効きやすい形です。因果ではなく傾向として見てください。');
    else if(d<=0)
      add('good','画面の時間と 学習量は 打ち消し合っていない',
        `長い日 平均${sp.hiStudy}／短い日 平均${sp.loStudy}。`,
        'ゲームの時間が勉強を削っている形にはなっていません。時間の総量ではなく、順番が守れているとみられます。');
  }
  if(S.screen.avg>=180) add('watch','画面の時間が1日あたり長い',
    `平均 ${S.screen.avg}分／日（ゲーム${S.screen.gameMin}分・アニメ${S.screen.animeMin}分）。`,
    '夏休みは長くなりがちです。2学期の平日の上限を、今のうちに数字で決めておくと揉めません。');

  /* 作文 */
  const wc=S.writing.cmp;
  if(wc.pct!=null && wc.pct>=25) add('good','ふりかえりの文章が長くなった',
    `1日あたり 前半${wc.first}字 → 後半${wc.second}字（+${wc.pct}%）。`,
    '字数は「書くのが苦にならなくなった」の目安。中身の質は 下の代表作で見てください。');
  else if(wc.pct!=null && wc.pct<=-20) add('watch','ふりかえりの文章が短くなった',
    `1日あたり 前半${wc.first}字 → 後半${wc.second}字（${wc.pct}%）。`,
    '飽きか、書くことが尽きたか。書く前に「何を書くか」を1つ決めてから書かせると戻ります。');
  if(S.writing.kanjiSecond>S.writing.kanjiFirst) add('good','使う漢字の種類が増えた',
    `前半 ${S.writing.kanjiFirst}種類 → 後半 ${S.writing.kanjiSecond}種類（全期間で ${S.writing.kanjiKinds}種類）。`,
    'ひらがなで書けるところを漢字で書こうとした回数が増えた、ということ。習った漢字が「使える漢字」になりつつあります。');
  if(S.writing.shortDays>=Math.max(3,Math.round(S.writing.days*0.3))) add('watch','ひとことで終わった日が多い',
    `20字未満の日が ${S.writing.shortDays}日／${S.writing.days}日。`,
    '「たのしかった」だけで終わる日。“何が・どうして”を1つ足すだけで倍になります。');

  /* リズム */
  if(S.clock.first!=null && S.clock.second!=null){
    const dh=Math.round((S.clock.second-S.clock.first)*10)/10;
    const fmt=h=>{ const H=Math.floor(h), M=Math.round((h-H)*60); return H+':'+String(M).padStart(2,'0'); };
    if(dh>=1.5) add('watch','記録する時間が 後半になるほど 遅くなった',
      `記録した時刻の中央値が 前半 ${fmt(S.clock.first)} → 後半 ${fmt(S.clock.second)}（${dh>0?'+':''}${dh}時間）。`,
      '「その日の作業が後ろにずれた」目安になります。2学期の起床時刻に直結するので、8月末の数日で戻しておくのがおすすめです。');
    else if(Math.abs(dh)<1) add('good','記録する時間が 最後まで ぶれていない',
      `中央値 前半 ${fmt(S.clock.first)} ／ 後半 ${fmt(S.clock.second)}。`,
      '生活のリズムが崩れていない目安。2学期への切り替えは軽く済みそうです。');
  }
  if(S.clock.lateDays>=Math.max(3,Math.round(S.days.recorded*0.25)))
    add('watch','21時以降に記録した日が多い',`${S.clock.lateDays}日。`,
      '記録そのものが遅いだけの日もありますが、続くと就寝時刻に効きます。');

  /* タイピング */
  if(S.typing.gainPct!=null && S.typing.gainPct>=20) add('good','タイピングのスコアが伸びた',
    `はじめ ${S.typing.first} → 自己ベスト ${S.typing.best}（+${S.typing.gainPct}%）。記録した日 ${S.typing.count}日。`,
    '同じ条件で測っているので、伸びはそのまま実力の伸びと見て構いません。');

  /* 曜日 */
  const wkStudy=S.weekday.filter(w=>w.n>0);
  if(wkStudy.length>=5){
    const lo=wkStudy.slice().sort((a,b)=>a.study-b.study)[0];
    const hi=wkStudy.slice().sort((a,b)=>b.study-a.study)[0];
    if(hi.study>0 && lo.study < hi.study*0.5)
      add('info','曜日でムラがある',
        `いちばん多いのは ${hi.label}よう日（平均${hi.study}）、少ないのは ${lo.label}よう日（平均${lo.study}）。`,
        '習い事や外出の曜日と重なっていないか確認を。ムラ自体は悪くありませんが、2学期の宿題の配分に使えます。');
  }

  return F;
}

/* =====================================================================
   紙もの 3つ（しょうじょう／ぼうけんの きろく／記録レポート）
   ・どれも「白いA4」を そのまま 画面に 出す ＝ 印刷したものと 同じ
   ・グラフは responsive:false（mmの 紙の中でも くずれない）
   ===================================================================== */
const SH_W = 680;                       /* 紙の 中身の はば（180mm ≒ 680px） */
let sheetCharts = [];
function killSheetCharts(){ sheetCharts.forEach(c=>{try{c.destroy()}catch(e){}}); sheetCharts=[]; }

function shDate(d){ if(!d) return ''; const t=parseYmd(d); return (t.getMonth()+1)+'月'+t.getDate()+'日'; }
function shDateW(d){ if(!d) return ''; const t=parseYmd(d); return (t.getMonth()+1)+'/'+t.getDate()+'('+WEEK[t.getDay()]+')'; }
function shHM(min){ const h=Math.floor(min/60), m=Math.round(min%60);
  return h? (h+'時間'+(m?m+'分':'')) : (m+'分'); }
function shClock(h){ if(h==null) return '—'; const H=Math.floor(h), M=Math.round((h-H)*60);
  return H+':'+String(M).padStart(2,'0'); }
function shNum(v){ return (Math.round(v*10)/10).toLocaleString('ja-JP'); }
/* やることの 単位が ぜんぶ 同じなら その単位、ちがえば 空 */
function shUnit(S){
  const u=[...new Set((S.study.byName||[]).filter(g=>g.done>0).map(g=>g.unit||''))].filter(Boolean);
  return u.length===1 ? u[0] : '';
}
function shArrow(pct){
  if(pct==null) return {cls:'fl', mark:'→', txt:'—'};
  if(pct>=10)  return {cls:'up', mark:'▲', txt:'+'+pct+'%'};
  if(pct<=-10) return {cls:'dn', mark:'▼', txt:pct+'%'};
  return {cls:'fl', mark:'→', txt:(pct>0?'+':'')+pct+'%'};
}

/* =====================================================================
   ① しょうじょう
   ===================================================================== */
function sheetShou(S, name){
  const u = shUnit(S);
  const studyDays = S.rows.filter(o=>o.rec&&o.study>0).length;
  const moveAll = S.move.exMin + S.move.poolMin;
  const t = parseYmd(S.days.last || S.range.end);
  const cells = [
    ['つづけた 日', S.days.recorded, '日'],
    ['べんきょう', shNum(S.study.total), (u||'かい')],
    ['うごいた 時間', Math.round(moveAll/60), '時間'],
    ['書いた 文字', S.writing.totalChars.toLocaleString('ja-JP'), '字'],
    ['タイピング さいこう', (S.typing.best!=null?S.typing.best:'—'), 'てん']
  ];
  return `
<div class="sheet shou"><div class="shou-in">
  <div class="shou-ttl">しょうじょう</div>
  <div class="shou-sub">S U M M E R　Q U E S T　2 0 2 6</div>
  <div class="shou-name">${esc(name)}<i>どの</i></div>
  <div class="shou-body">
    あなたは この なつやすみの あいだ<br>
    <em>${S.days.recorded}日</em> つづけて じぶんの きろくを つけ<br>
    ${S.days.streakMax>=S.days.recorded
      ? 'ただの 一日も 休むこと なく'
      : 'いちばん 長いときは <em>'+S.days.streakMax+'日</em> つづけて'}<br>
    さいごの日まで やりぬきました。<br>
    その ねばりづよさを たたえ ここに しょうじょうを おくります。
  </div>
  <div class="shou-nums">
    <div class="hd">きみが つみあげた もの</div>
    <div class="shou-grid">
      ${cells.map(c=>`<div><span class="v">${c[1]}<i>${c[2]}</i></span><span class="l">${c[0]}</span></div>`).join('')}
    </div>
  </div>
  <div class="shou-foot">
    <div class="shou-date">${t.getFullYear()}年 ${t.getMonth()+1}月 ${t.getDate()}日</div>
    <div style="display:flex;align-items:flex-end">
      <div class="shou-sign"><span>DAILY MISSION SYSTEM</span><b>SUMMER QUEST</b></div>
      <div class="shou-seal">夏の<br>ぼうけん</div>
    </div>
  </div>
</div></div>`;
}

/* =====================================================================
   ② ぼうけんの きろく（本人用）
   🔴 できなかったことは 1行も 書かない
   ===================================================================== */
function sheetKid(S, name, fin){
  const u = shUnit(S);
  const moveAll = S.move.exMin + S.move.poolMin;
  const studyDays = S.rows.filter(o=>o.rec&&o.study>0).length;

  /* --- 40マス カレンダー --- */
  const first = parseYmd(S.range.dates[0]);
  const pad = first.getDay();
  let cal = '<div class="kcal">' + WEEK.map(w=>`<div class="hd">${w}</div>`).join('')
          + new Array(pad).fill('<div></div>').join('');
  S.rows.forEach(o=>{
    const d = parseYmd(o.date);
    const big = o.rec && (o.study>0 && o.move>0 && o.chars>0);
    cal += `<div class="c ${o.rec?('on'+(big?' big':'')):'pre'}"><b>${d.getDate()}</b>${o.rec?'<u>〇</u>':''}</div>`;
  });
  cal += '</div>';

  /* --- やること別（できた ぶんだけ 出す） --- */
  const goals = (S.study.byName||[]).filter(g=>g.done>0);
  const goalHtml = goals.map(g=>{
    const pct = g.goalTotal? Math.min(100,Math.round(g.done/g.goalTotal*100)) : null;
    return `<tr><td class="l">${esc(g.emoji||'📖')} ${esc(g.name)}</td>
      <td><b>${shNum(g.done)}</b>${esc(g.unit||'')}</td>
      <td>${g.days}日</td>
      <td class="bar"><i style="width:${pct!=null?Math.max(4,pct*0.70):0}px"></i><u>${pct!=null?pct+'%':'—'}</u></td></tr>`;
  }).join('');

  /* --- いちばん よく書けた ふりかえり --- */
  const bd = (fin&&fin.best&&fin.best.date) ? fin.best.date : S.writing.maxDate;
  const brow = S.rows.find(o=>o.date===bd);
  const bwhy = (fin&&fin.best&&fin.best.why) ? fin.best.why : '';

  /* --- 使った漢字 --- */
  const kanji = (S.writing.kanjiList||[]).slice(0,80);

  const letter = (fin&&fin.letter) ? fin.letter : '';
  const fam    = (fin&&fin.family&&fin.family.text) ? fin.family : null;

  return `
<div class="sheet kid" data-fit="1">
  <div class="kid-head">
    <div class="who"><span>なまえ</span><b>${esc(name)}</b></div>
    <b>ぼうけんの きろく</b>
    <span>${shDate(S.days.first)} 〜 ${shDate(S.days.last)}　SUMMER QUEST 2026</span>
  </div>

  <div class="kid-kpis">
    <div class="kid-kpi c1"><div class="v">${S.days.recorded}<i>日</i></div><div class="l">つづけた 日</div></div>
    <div class="kid-kpi c2"><div class="v">${shNum(S.study.total)}<i>${esc(u||'かい')}</i></div><div class="l">べんきょう</div></div>
    <div class="kid-kpi c3"><div class="v">${Math.round(moveAll/60)}<i>時間</i></div><div class="l">うごいた 時間</div></div>
    <div class="kid-kpi c4"><div class="v">${S.writing.totalChars.toLocaleString('ja-JP')}<i>字</i></div><div class="l">書いた 文字</div></div>
  </div>

  <h4>🗓 きみが 〇を つけた 日</h4>
  ${cal}
  <p class="tiny muted">こい〇＝べんきょう・うんどう・ふりかえり が そろった日（${S.rows.filter(o=>o.rec&&o.study>0&&o.move>0&&o.chars>0).length}日）</p>

  <h4>📚 やった ぶん</h4>
  <table class="rt"><thead><tr><th class="l">やったこと</th><th>ぜんぶで</th><th>やった日</th><th>もくひょう</th></tr></thead>
  <tbody>${goalHtml||'<tr><td class="l" colspan="4">—</td></tr>'}</tbody></table>

  <h4>📈 べんきょうの つみあげ</h4>
  <div class="chart"><canvas id="c_kStudy" width="${SH_W}" height="160"></canvas></div>
  <p class="tiny muted">やるたびに 山が 高く なっていくよ。さいごは ${shNum(S.study.total)}${esc(u||'かい')}！</p>
</div>

<div class="sheet kid flow">
  <h4>⌨️ タイピングの せいちょう</h4>
  <div class="chart"><canvas id="c_kType" width="${SH_W}" height="165"></canvas></div>
  <div class="shkpis k3">
    <div class="shkpi"><div class="l">はじめの スコア</div><div class="v">${S.typing.first!=null?S.typing.first:'—'}</div></div>
    <div class="shkpi"><div class="l">じこ ベスト</div><div class="v" style="color:#0b3fa8">${S.typing.best!=null?S.typing.best:'—'}</div></div>
    <div class="shkpi"><div class="l">のびた ぶん</div><div class="v" style="color:#0e9f6e">${S.typing.gainPct!=null?'+'+S.typing.gainPct+'%':'—'}</div></div>
  </div>

  ${brow ? `<h4>✍️ いちばん よく 書けた ふりかえり</h4>
  <div class="quote"><div class="d">${shDateW(brow.date)}　${brow.chars}字</div>
    <div class="x">${esc(brow.text||'')}</div>
    ${bwhy?`<div class="why">▶ ${esc(bwhy)}</div>`:''}</div>` : ''}

  ${kanji.length? `<h4>㊗ この なつに つかった 漢字　<span style="font-size:9pt;font-weight:400;color:#64748b">${S.writing.kanjiKinds}しゅるい</span></h4>
  <div class="klist">${kanji.map(c=>`<span>${esc(c)}</span>`).join('')}</div>` : ''}

  ${letter? `<h4>💌 AIコーチから きみへ</h4>
  <div class="letter">${esc(letter)}<div class="from">SUMMER QUEST AIコーチ より</div></div>` : ''}

  ${fam? `<h4>💝 おうちの人から</h4>
  <div class="letter fam">${esc(fam.text)}<div class="from">${esc(fam.from||'おうちの人')} より</div></div>` : ''}

  ${(letter||fam) ? '' : `<div class="howto" style="border-left-color:#0891b2;background:#f0fbfe;margin-top:12px">
    💌 <b>AIコーチからの さいごの手紙</b>と 💝 <b>おうちの人からのメッセージ</b>は、ここに 出ます。
    <span class="tiny">（手紙は さいごの日に とどきます。おうちの人からの メッセージは せってい画面で 先に 書いておけます）</span></div>`}
</div>`;
}

function drawKidCharts(S){
  if(typeof Chart==='undefined') return;
  const L = S.range.labels;
  const grid={color:'#e2e8f0'}, tick={color:'#64748b',font:{family:'Noto Sans JP',size:9},maxRotation:0,autoSkip:true,maxTicksLimit:14};
  const base=(ex={})=>Object.assign({responsive:false,maintainAspectRatio:false,devicePixelRatio:2,
    animation:false, plugins:{legend:{display:false}},
    scales:{x:{grid,ticks:tick},y:{grid,ticks:tick,beginAtZero:true}}}, ex);

  const cs=document.getElementById('c_kStudy');
  if(cs) sheetCharts.push(new Chart(cs,{type:'line',data:{labels:L,datasets:[
    {label:'つみあげ',data:S.study.cum,borderColor:'#0b3fa8',
     backgroundColor:(c)=>{ const a=c.chart.ctx.createLinearGradient(0,0,0,180);
       a.addColorStop(0,'rgba(11,63,168,.34)'); a.addColorStop(1,'rgba(103,211,232,.10)'); return a; },
     fill:true,tension:.28,pointRadius:0,borderWidth:3}
  ]},options:base()}));

  const ct=document.getElementById('c_kType');
  if(ct) sheetCharts.push(new Chart(ct,{type:'line',data:{labels:L,datasets:[
    {data:S.typing.daily,borderColor:'#0891b2',backgroundColor:'rgba(8,145,178,.14)',
     fill:true,tension:.3,pointRadius:2.5,pointBackgroundColor:'#0891b2',borderWidth:2.5,spanGaps:true}
  ]},options:base()}));
}

/* =====================================================================
   ③ なつやすみ 記録レポート（親用）
   ・4まい。1まい目に「気づいたこと」＝いそがしい人は ここだけ
   ・グラフには かならず「見かた」を つける
   ===================================================================== */
function sheetParent(S, name, fin){

  const head = (t,s)=>`<div class="rp-head"><div class="t"><b>${t}</b><span>${s}</span></div>
     <div class="n"><b>${esc(name)}</b>${made.getFullYear()}年${made.getMonth()+1}月${made.getDate()}日 作成</div></div>`;

  /* ---------- 1まい目：概要と 気づき ---------- */
  /* 1ページに おさまる ぶんだけ 出す（あふれると 印刷が くずれる）。
     中身は ぜんぶ 2ページ目いこうの グラフ・表に 出ているので 落としても 情報は 欠けない。 */
  const rest = S.findings.filter(f=>!f.pin);   /* pin（単位ちがい）は fixPanel が 受け持つ */
  const _g = rest.filter(f=>f.level==='good');
  const _w = rest.filter(f=>f.level==='watch');
  const _i = rest.filter(f=>f.level==='info');
  /* 🔴 「気になる」だけで 紙が うまると、できていた ことが 1つも 残らない。
        先に 上限を つけて、ほめる ぶんが かならず 残るように する。 */
  const watch= _w.slice(0,4), good = _g.slice(0,3), info = _i.slice(0,2);
  const cut  = (_w.length-watch.length)+(_g.length-good.length)+(_i.length-info.length);
  const fCard = f=>`<div class="find ${f.level}" data-fitdrop="1">
    <span class="tag">${f.level==='good'?'できていた':(f.level==='watch'?'気になる':'参考')}</span>

    ${f.how?`<div class="hw">▶ ${esc(f.how)}</div>`:''}</div>`;

  const goalDone = (S.study.byName||[]).filter(g=>g.goalTotal!=null);
  const goalPct = goalDone.length
    ? Math.round(goalDone.reduce((a,g)=>a+Math.min(100,g.pct),0)/goalDone.length) : null;

  const p1 = `<div class="sheet" data-fit="1">

    「どれだけ続いたか」「どこで崩れたか」を数字で見て、2学期の声かけに使うことを目的にしています。
    最後のページに、この数字の限界も書いてあります。</p>

  <h4>1. 全体のようす</h4>

    <div class="shkpi"><div class="l">記録率</div><div class="v">${S.days.rate}<i>%</i></div><div class="s">最長連続 ${S.days.streakMax}日</div></div>
    <div class="shkpi"><div class="l">学習の総量</div><div class="v">${shNum(S.study.total)}<i>${esc(u||'')}</i></div><div class="s">1日平均 ${S.study.avg}</div></div>
    <div class="shkpi"><div class="l">目標の達成率</div><div class="v">${goalPct!=null?goalPct:'—'}<i>%</i></div><div class="s">目標つき ${goalDone.length}件の平均</div></div>
    <div class="shkpi"><div class="l">運動した日</div><div class="v">${S.move.activeRate}<i>%</i></div><div class="s">${S.move.activeDays}日／${S.days.recorded}日</div></div>
  </div>
  <div class="shkpis k5">

    <div class="shkpi"><div class="l">タイピング</div><div class="v">${S.typing.best!=null?S.typing.best:'—'}</div><div class="s">初回 ${S.typing.first!=null?S.typing.first:'—'} ／ ${S.typing.count}日</div></div>
    <div class="shkpi"><div class="l">記録した時刻</div><div class="v">${shClock(S.clock.median)}</div><div class="s">中央値（21時以降 ${S.clock.lateDays}日）</div></div>
  </div>
  <div class="howto"><b>見かた：</b>「記録率」は 中身の多さではなく <b>続いたかどうか</b>だけを見た数字です。

    「学習の総量」は 単位のちがう教材を足しているので、<b>合計そのものより 推移（2ページ目いこう）</b>を見るほうが正確です。</div>

  <h4>2. 気になること</h4>

  /* ---------- 2まい目：学習 ---------- */
  const sc = S.study.cmp, sa = shArrow(sc.pct);
  const rows2 = (S.study.byName||[]).filter(g=>g.done>0||g.goalTotal!=null).map(g=>{

  /* ---------- 3まい目：生活とからだ ---------- */

  const p3 = `<div class="sheet">

/* =====================================================================
   紙が A4に おさまるまで 少しずつ 詰める（グラフを 描く 前に よぶ）
   ---------------------------------------------------------------------
   🔴 出る 中身の 量は データ次第で 変わる（気づきの 数・やることの 数・AIの 文の 長さ）。
      決めうちの 上限では いつか あふれる。あふれた 紙は 印刷で ぶつ切りに なる。
   ① [data-fitdrop] を 後ろから 外す（外した ぶんは 件数を 書く。だまって 消さない）
   ② それでも 高いなら グラフの 高さを 少しずつ 下げる（中身は 消えない）
   ===================================================================== */
function fitSheets(root){
  /* 🔴 .sheet は min-height:297mm なので scrollHeight は 1123px より 下がらない。
        しきい値を 1123px「より 大きい」に しないと、おさまっているのに 削りつづける。 */
  const lim = Math.round(297/25.4*96);         /* A4 たて＝1123px（96dpi） */
  const host = root || document;
  host.querySelectorAll('.sheet[data-fit]').forEach(sh=>{
    const note = sh.querySelector('[data-fitnote]');
    let cut = note ? (Number(note.dataset.cut)||0) : 0;
    const say = ()=>{ if(!note) return; note.style.display='';
      note.textContent = '※ このほか ' + cut + '件の気づきがありましたが、紙面の都合で省略しています'
                       + '（内容は2ページ目以降のグラフと表に含まれます）。'; };
    /* ① 気づきのカードを 後ろから（1つは 残す） */
    let guard = 60;
    while(sh.scrollHeight > lim && guard-- > 0){
      const d = sh.querySelectorAll('[data-fitdrop]');
      if(d.length <= 1) break;
      d[d.length-1].remove(); cut++; say();
    }
    /* ② できていたことの 箇条書きを 後ろから（1つは 残す） */
    guard = 40;
    while(sh.scrollHeight > lim && guard-- > 0){
      const d = sh.querySelectorAll('[data-fitdrop2]');
      if(d.length <= 1) break;
      d[d.length-1].remove(); cut++; say();
    }
    /* ③ グラフを 少しずつ 低く */
    let step = 0;
    while(sh.scrollHeight > lim && step++ < 10){
      const cvs = sh.querySelectorAll('.chart canvas');
      if(!cvs.length) break;
      let moved = false;
      cvs.forEach(c=>{
        const h = Number(c.getAttribute('height')) || 160;
        if(h > 110){ c.setAttribute('height', String(Math.round(h*0.93))); moved = true; }
      });
      if(!moved) break;
    }
    /* ④ それでも 入らないなら「ながれる紙」に する。
       🔴 中身を これ以上 消すより、2枚に わたって 印刷される ほうが まし。
          （切り取られると 何が 消えたか 分からない） */
    if(sh.scrollHeight > lim) sh.classList.add('flow');
  });
}

/* =====================================================================
   FINALE：エンディング と 紙もの（v1.11.0）
   ---------------------------------------------------------------------
   ・8/31（＝夏休みの さいごの日）の 記録が 出たら、TOPに 金の ボタンが 出る
   ・押すと エンディング（星→カレンダー40日→数字→AIの手紙）
   ・そこから しょうじょう／ぼうけんの きろく（本人用）へ
   ・親用レポートは せってい画面から（子アカでは 出ない）
   🔴 AIは 1回だけ よぶ。結果は meta/finale に しまって 作りなおさない
   ===================================================================== */
const SQ_FINALE_URL = 'https://asia-northeast1-carflow-9d500.cloudfunctions.net/sqFinale';
let FINALE = null;          // {letter, best:{date,why}, parentNote:{summary,advice}, madeAt}
let finaleBusy = false;
let _endTimers = [];
let _starsOn = false;

/* ---------- しまう・とりだす ---------- */
Store.getFinale = async function(){
  if(this.mode==='firebase'){
    try{ const {doc,getDoc}=this.fns; const s=await withTimeout(getDoc(doc(this.fdb,'meta','finale')),8000);
      if(s.exists()){ const m=s.data(); LS.set('sq_finale',JSON.stringify(m)); return m; } }
    catch(e){ console.warn('しめくくりの よみこみは 端末を つかいます',e); }
  }
  try{ const t=LS.get('sq_finale'); return t?JSON.parse(t):null; }catch(e){ return null; }
};
Store.setFinale = async function(obj){
  LS.set('sq_finale',JSON.stringify(obj));
  if(this.mode==='firebase'){
    try{ const {doc,setDoc}=this.fns; withTimeout(setDoc(doc(this.fdb,'meta','finale'),obj),8000)
      .catch(e=>console.warn('しめくくりの 同期は あとで',e)); }catch(e){ console.warn(e); }
  }
  return true;
};

let _statsCache = null, _statsKey = '';
function finaleS(){
  const key = Object.keys(REPORTS).length + '|' + CONFIG.vacStart + '|' + CONFIG.vacEnd
            + '|' + JSON.stringify(CONFIG.fixes||[]) + '|' + JSON.stringify((CONFIG.goals||[]).map(g=>[g.name,g.unit,g.total]));
  if(_statsKey !== key){ _statsCache = finaleStats(REPORTS, CONFIG); _statsKey = key; }
  return _statsCache;
}
function finaleClearCache(){ _statsKey=''; _statsCache=null; }

/* AIに わたす「数字の ことば」 */
function finaleLines(S){
  const u = shUnit(S);
  const L = [];
  L.push(`記録：${S.days.recorded}日／${S.days.spanDays}日（${S.days.rate}%）・最長連続 ${S.days.streakMax}日`);
  L.push(`学習の総量：${shNum(S.study.total)}${u}（1日平均 ${S.study.avg}／前半 ${S.study.cmp.first} → 後半 ${S.study.cmp.second}）`);
  (S.study.byName||[]).forEach(g=>{
    if(!g.done && g.goalTotal==null) return;
    L.push(`やること「${g.name}」：${shNum(g.done)}${g.unit}`
      + (g.goalTotal!=null?`／目標 ${g.goalTotal}${g.unit}（${g.pct}%）`:'')
      + `・取り組んだ日 ${g.days}日（${g.rate}%）・1日あたり 前半 ${g.pace.first} → 後半 ${g.pace.second}`);
  });
  L.push(`うんどう：${S.move.exDays}日（${S.move.exRate}%）・合計 ${S.move.exMin}分／うんどう0が最長 ${S.move.exGap}日`);
  L.push(`プール：${S.move.poolDays}日（${S.move.poolRate}%）・合計 ${S.move.poolMin}分　※入らない日はほぼ天候`);
  (S.move.poolByMonth||[]).forEach(m=>L.push(`　プール ${Number(m.month.slice(5))}月：${m.days}日／${m.of}日（${m.rate}%）`));
  L.push(`ゲーム・アニメ：1日平均 ${S.screen.avg}分（ゲーム ${S.screen.gameMin}分・アニメ ${S.screen.animeMin}分／前半 ${S.screen.cmp.first} → 後半 ${S.screen.cmp.second}）`);
  if(S.screen.split) L.push(`画面が長い日（${S.screen.split.median}分超・${S.screen.split.hiN}日）の学習量 ${S.screen.split.hiStudy}／短い日（${S.screen.split.loN}日）${S.screen.split.loStudy}`);
  L.push(`タイピング：初回 ${S.typing.first} → 自己ベスト ${S.typing.best}（記録 ${S.typing.count}日${S.typing.gainPct!=null?'／+'+S.typing.gainPct+'%':''}）`);
  L.push(`ふりかえり：書いた日 ${S.writing.days}日・合計 ${S.writing.totalChars}字・1日平均 ${S.writing.avg}字（前半 ${S.writing.cmp.first} → 後半 ${S.writing.cmp.second}）`);
  L.push(`　20字未満の日 ${S.writing.shortDays}日／60字以上の日 ${S.writing.longDays}日・一文の平均 ${S.writing.sentAvg}字`);
  L.push(`　使った漢字の種類 ${S.writing.kanjiKinds}種（前半 ${S.writing.kanjiFirst} → 後半 ${S.writing.kanjiSecond}）`);
  L.push(`記録した時刻の中央値：${shClock(S.clock.median)}（前半 ${shClock(S.clock.first)} → 後半 ${shClock(S.clock.second)}／21時以降 ${S.clock.lateDays}日）`);
  L.push(`習い事のあった日：${S.narai.days}日`);
  const wk = S.weekday.filter(w=>w.n>0);
  if(wk.length) L.push('曜日別の学習量（平均）：' + wk.map(w=>`${w.label}${w.study}`).join('／'));
  if(S.fixes && S.fixes.n) S.fixes.applied.forEach(f=>
    L.push(`※ ${f.date} の「${f.name}」は 入力 ${f.from} を 集計では ${f.to==null?'除外':f.to} として扱っています（${f.note||'単位ちがいのため'}）`));
  return L;
}

/* ---------- AIを よぶ（1回だけ） ---------- */
async function finaleAsk(force){
  if(finaleBusy) return FINALE;
  if(FINALE && !force) return FINALE;
  finaleBusy = true;
  try{
    const S = finaleS();
    const body = {
      token: SQ_REPLY_TOKEN,
      name: finaleName(),
      first: S.days.first, last: S.days.last,
      spanDays: S.days.spanDays, recorded: S.days.recorded,
      rate: S.days.rate, streakMax: S.days.streakMax,
      lines: finaleLines(S),
      findings: S.findings.map(f=>({level:f.level, title:f.title, body:f.body})),
      reflections: S.rows.filter(o=>o.rec && o.chars>0).map(o=>({date:o.date, chars:o.chars, text:o.text}))
    };
    const r = await withTimeout(fetch(SQ_FINALE_URL,{
      method:'POST', headers:{'Content-Type':'application/json','X-SQ-Token':SQ_REPLY_TOKEN},
      body: JSON.stringify(body)
    }), 180000);
    if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('AI '+r.status+' '+t.slice(0,120)); }
    const j = await r.json();
    FINALE = { letter:j.letter||'', best:j.best||null, parentNote:j.parentNote||null,
               madeAt:new Date().toISOString() };
    await Store.setFinale(FINALE);
    return FINALE;
  }catch(e){
    console.warn('しめくくりの AIに つながりませんでした',e);
    return null;
  }finally{ finaleBusy = false; }
}

   星空（エンディングの あいだだけ 動く）
   ===================================================================== */
function starsStart(){
  const c = document.getElementById('starsF'); if(!c || _starsOn) return;
  _starsOn = true;
  const x = c.getContext('2d'); let st=[];
  const rs = ()=>{ c.width=innerWidth; c.height=innerHeight;
    st=Array.from({length:110},()=>({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.3+.2,a:Math.random(),s:Math.random()*.015+.004})); };
  rs(); c._rs = rs; addEventListener('resize', rs);
  (function loop(){
    if(!_starsOn) return;
    x.clearRect(0,0,c.width,c.height);
    st.forEach(p=>{ p.a+=p.s; const o=(Math.sin(p.a)+1)/2*.7+.15;
      x.fillStyle='rgba(200,225,255,'+o+')'; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); });
    requestAnimationFrame(loop);
  })();
}
function starsStop(){ _starsOn=false; const c=document.getElementById('starsF');
  if(c && c._rs) removeEventListener('resize', c._rs); }

function endingHtml(S){
  const fam = CONFIG.familyMsg && String(CONFIG.familyMsg.text||'').trim() ? CONFIG.familyMsg : null;

  const u = shUnit(S);
  const stats = [

    {n:S.move.poolDays, l:'プールに 入った 日'},
    {n:S.writing.days,  l:'かいた ふりかえり'},
    {n:S.writing.totalChars, s:'字', l:'かいた 字の 数'},
    {n:(S.typing.best!=null?S.typing.best:0), l:'タイピング さいこう'},
    {n:moveAll, s:'分', l:'うんどうした 時間'}
  ];
  /* 月ごとの カレンダー（夏休みの 期間ぜんぶ） */
  const months = [];
  S.range.dates.forEach(d=>{ const k=d.slice(0,7); if(months.indexOf(k)<0) months.push(k); });
  const MN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const WD=['日','月','火','水','木','金','土'];
  const calHtml = months.map(k=>{
    const y=+k.slice(0,4), m=+k.slice(5)-1;
    const first=new Date(y,m,1), last=new Date(y,m+1,0);
    let g = WD.map((w,i)=>`<div class="wd${i===0?' u':(i===6?' s':'')}">${w}</div>`).join('');
    for(let i=0;i<first.getDay();i++) g+='<div></div>';
    for(let d=1;d<=last.getDate();d++){
      const key=ymd(new Date(y,m,d));
      const inR = key>=S.range.start && key<=S.range.end;
      g += `<div class="cell${inR?' act':''}"${inR?` data-d="${key}"`:''}><span>${d}</span>`
         + (inR?'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/></svg>':'') + '</div>';
    }
    return `<div class="cal"><div class="m">${MN[m]}</div><div class="grid7">${g}</div></div>`;
  }).join('');

  return `
  <button class="skip" id="endSkip">とじる</button>
  <div class="ewrap">
    <div class="etitle fade" id="et1">
      <div class="sub">SUMMER QUEST 2026</div>
      <div class="main">ぼうけんの きろく</div>
      <div class="days">${(function(){const a=parseYmd(S.days.first),b=parseYmd(S.days.last);
        return (a.getMonth()+1)+' / '+a.getDate()+' &nbsp;—&nbsp; '+(b.getMonth()+1)+' / '+b.getDate()
             + ' &nbsp;・&nbsp; '+S.days.recorded+' DAYS';})()}</div>
    </div>

    <div class="calbox fade" id="et2">
      <div class="calhead">
        <div class="cntl">つづけた 日</div>
        <div class="cnt"><span id="endCnt">0</span> <span style="font-size:16px;color:var(--silver-dim)">/ ${S.days.recorded}</span></div>
      </div>
      <div class="cals">${calHtml}</div>
      <div class="allclear" id="endAc">
        <div class="big">${S.days.missingN===0
          ? S.days.recorded+'日、1日も 休まなかった'
          : S.days.recorded+'日、きろくを つづけた'}</div>
        <div class="sm">${shDate(S.days.first)}から ${shDate(S.days.last)}まで<br>
          ${S.days.missingN===0 ? 'きろくが とぎれた 日は ありません'
                                : 'いちばん 長いときは '+S.days.streakMax+'日 つづきました'}</div>
      </div>
    </div>

    <div class="stats fade" id="et3">
      ${stats.map(o=>`<div class="stat${o.gold?' gold':''}"><div class="n" data-to="${o.n}">0${o.s?`<small>${o.s}</small>`:''}</div><div class="l">${o.l}</div></div>`).join('')}
    </div>

    <div class="fade" id="et4">
      <div class="ehead">💌 AIコーチから きみへ</div>
      <div id="endLetter">${FINALE&&FINALE.letter
        ? `<div class="eletter">${esc(FINALE.letter)}<div class="from">SUMMER QUEST AIコーチ より</div></div>`
        : `<div class="eletter waitbox" id="endLetterWait">40日ぶんを 読んでいます…<br>
             <span style="font-size:12px;opacity:.7">すこし 時間が かかります（30秒くらい）</span></div>`}</div>

      ${fam?`<div class="ehead" style="margin-top:26px">💝 おうちの人から</div>
        <div class="eletter fam">${esc(fam.text)}<div class="from">${esc(fam.from||'おうちの人')} より</div></div>`:''}

      <div class="ebtns">
        <button class="btn gold2" id="endShou">🏅 しょうじょうを 見る</button>
        <button class="btn" id="endKid">📔 ぼうけんの きろくを 見る</button>
      </div>
      <div class="again"><button id="endAgain">もういちど 見る</button></div>
    </div>
  </div>`;
}

function runEnding(S){
  endClear();
  const E=document.getElementById('ending');
  const cells = {};
  E.querySelectorAll('.cell[data-d]').forEach(c=>cells[c.dataset.d]=c);
  const days = S.rows.filter(o=>o.rec).map(o=>o.date);
  _T(()=>document.getElementById('et1').classList.add('in'), 120);
  _T(()=>document.getElementById('et2').classList.add('in'), 900);
  let t=1900;
  days.forEach((k,i)=>{
    const isLast = (i===days.length-1);
    const step = isLast ? 700 : Math.max(52, 150-i*2.6);
    _T(()=>{
      const c=cells[k]; if(!c) return;
      c.classList.add('done','pop'); if(isLast) c.classList.add('last');
      const n=document.getElementById('endCnt'); if(n) n.textContent=i+1;
      setTimeout(()=>c.classList.remove('pop'),520);
    }, t);
    t += step;
  });
  _T(()=>{ const a=document.getElementById('endAc'); if(a) a.classList.add('in'); }, t+250);
  _T(()=>{ const e=document.getElementById('et3'); if(e){ e.classList.add('in'); endCountUp(); } }, t+1200);
  _T(()=>{ const e=document.getElementById('et4'); if(e) e.classList.add('in'); }, t+2400);
}
function endCountUp(){
  document.querySelectorAll('#ending .stat .n').forEach(n=>{
    const to=+n.dataset.to, small=n.querySelector('small');
    const dur=1100, t0=performance.now();
    (function tick(now){
      const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
      n.textContent=Math.round(to*e).toLocaleString('ja-JP');
      if(small) n.appendChild(small);
      if(p<1) requestAnimationFrame(tick);
    })(t0);
  });
}

/* =====================================================================
   記録の なおし ＝ その場で 1タップ
   ---------------------------------------------------------------------
   🔴 前は「せってい画面を さがして → 行を 足して → 設定を保存する を おす」の 3手が 必要だった。
      レポートには 警告だけ 出て、数字は まちがったまま。それでは 意味が ない。
      気づいた その場（レポート・せってい）で 押したら すぐ 効いて、すぐ クラウドにも 行く。
   ===================================================================== */
async function fixSave(){
  saveConfig();
  finaleClearCache();
  try{
    await Store.setConfig({ goals:CONFIG.goals, vacStart:CONFIG.vacStart, vacEnd:CONFIG.vacEnd,
      typingName:CONFIG.typingName, typingUrl:CONFIG.typingUrl, typingRule:CONFIG.typingRule,
      familyMsg:CONFIG.familyMsg||null, fixes:CONFIG.fixes||[] });
  }catch(e){ console.warn('なおしの 同期は あとで', e); }
}
async function fixAdd(date, name, value, note){
  CONFIG.fixes = (CONFIG.fixes||[]).filter(f=> !(f && f.d===date && f.n===name) );
  CONFIG.fixes.push({ d:date, n:name,
    v:(value===''||value==null) ? null : Number(value),
    note: note || (value===''||value==null ? '単位ちがいのため 集計から 除外'
                                           : '単位ちがい：入力を '+value+' として 読みかえ') });
  await fixSave();
  toast(value===''||value==null ? '集計から 外しました' : (value+' として 読みかえました'));
}
async function fixRemove(date, name){
  CONFIG.fixes = (CONFIG.fixes||[]).filter(f=> !(f && f.d===date && f.n===name) );
  await fixSave();
  toast('もとに もどしました');
}

function wireFixButtons(root, redraw){

      root.querySelectorAll('.fixbtn,.unfixbtn').forEach(x=>x.disabled=true);
      await fixAdd(b.dataset.fd, b.dataset.fn, b.dataset.fv);
      redraw();

  root.querySelectorAll('.unfixbtn').forEach(b=>{
    b.onclick = async ()=>{
      root.querySelectorAll('.fixbtn,.unfixbtn').forEach(x=>x.disabled=true);
      await fixRemove(b.dataset.fd, b.dataset.fn);
      redraw();
    };
  });
}

function ymd(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${da}`; }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayDate(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function todayStr(){ return ymd(todayDate()); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((parseYmd(a)-parseYmd(b))/86400000); }
const WEEK=['にち','げつ','か','すい','もく','きん','ど'];

/* =====================================================================
   祝日 API（holidays-jp）取得＋キャッシュ
   ===================================================================== */
const Holidays = { data:{}, loaded:new Set(),
  async loadYear(y){
    if(this.loaded.has(y)) return;
    this.loaded.add(y);
    try{
      const res = await fetch(`https://holidays-jp.github.io/api/v1/${y}/date.json`);
      if(res.ok){ const j=await res.json(); Object.assign(this.data,j); }
    }catch(e){ console.warn('祝日API取得失敗',e); }
  },
  name(dateStr){ return this.data[dateStr]||null; }
};

/* =====================================================================
   遅れ判定 → UIテーマ
   「昨日」まで連続で未記録の日数を数える。1日=黄, 2日以上=赤
   ===================================================================== */
function computeDelay(reports){
  const t = todayDate();
  const start = parseYmd(CONFIG.vacStart);
  const end = parseYmd(CONFIG.vacEnd);
  if(t < start || t > addDays(end,1)) return 0;      // 期間外は警告しない
  let missing=0;
  let d = addDays(t,-1); // 昨日から後ろへ
  while(d >= start){
    if(reports[ymd(d)]) break;   // 記録があれば連続ストップ
    missing++;
    if(missing>=2) break;
    d = addDays(d,-1);
  }
  return missing; // 0/1/2
}
function applyTheme(delay){
  document.body.classList.remove('warn1','warn2');
  if(delay===1) document.body.classList.add('warn1');
  else if(delay>=2) document.body.classList.add('warn2');
}

/* ---- 日報データの正規化（旧形式 object も配列として読む） ---- */
function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(x=>x && (x.name || x.minutes!=='' && x.minutes!=null));
  if(v.text || v.minutes) return [{name:v.text||'', minutes:v.minutes}]; // 旧: {text,minutes}
  return [];
}
const exArr   = r => toArr(r && r.exercise);
const gameArr = r => toArr(r && r.game);          // ゲーム＋アニメ（合計用）
/* ゲーム欄は 1つの欄で しゅるいを えらぶ方式。kind:'anime' が アニメ（TV）。
   kind が 無い 古いデータは ぜんぶ ゲームあつかい（後方ごかん） */
const isAnimeRow = x => !!(x && x.kind === 'anime');
const playArr  = r => gameArr(r).filter(x=>!isAnimeRow(x));   // 🎮ゲームだけ
const animeArr = r => gameArr(r).filter(isAnimeRow);          // 📺アニメだけ
const sumMin   = a => a.reduce((s,x)=>s+(Number(x.minutes)||0),0);
const poolMin = r => Number(r && r.pool) || 0;

/* =====================================================================
   ステータス算出（六角形レーダー）
   計測がむずかしいので、記録日数に応じて徐々に上昇するアルゴリズム。
   ゲーム・算数は伸びやすく（係数大）、漢字は後追い（係数小＋抑えめ）。
   実際の記録があれば少しだけボーナス（responsive）。0〜100。
   ===================================================================== */
function computeStats(reports){
  const dates=Object.keys(reports).filter(d=>d>=CONFIG.vacStart&&d<=CONFIG.vacEnd).sort();
  const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
  const R=Math.round;

  // ---- 夏休みの進み具合（時間経過）＝実力が終盤に向けて徐々に上がる土台 ----
  const totalDays=Math.max(1,diffDays(CONFIG.vacEnd,CONFIG.vacStart)+1);
  let elapsed=diffDays(todayStr(),CONFIG.vacStart)+1; elapsed=cl(elapsed,0,totalDays);
  const timeProg=elapsed/totalDays;                 // 0..1（時間だけで進む）
  const d=dates.length;                             // 記録した日数（増える一方）
  const dFactor=1-Math.exp(-d/8);                   // 記録の充実（単調に増える。実力は下げない）
  const smooth=x=>{x=cl(x,0,1);return x*x*(3-2*x);};

  // ---- 各項目の これまでの取り組み量＋日別（調子用） ----
  let mathP=0,kanjiP=0,gameM=0,exM=0,poolM=0,naraiD=0,bestType=0;
  const per={kanji:[],math:[],game:[],exercise:[],narai:[],typing:[]};
  dates.forEach(dt=>{
    const r=reports[dt]||{};
    let dm=0,dk=0;
    (r.study||[]).forEach(s=>{
      const nm=String(s.name||''); const p=Number(s.pages)||0;
      if(/算|さんすう|けいさん|計算|数/.test(nm)) dm+=p;
      else if(/漢|かんじ|国語|こくご|字|よみ/.test(nm)) dk+=p;
      else { dm+=p*0.5; dk+=p*0.5; }               // ふりわけ不明は半々
    });
    const dg=gameArr(r).reduce((s,x)=>s+(Number(x.minutes)||0),0);
    const de=exArr(r).reduce((s,x)=>s+(Number(x.minutes)||0),0);
    const dp=poolMin(r);
    const dn=(r.narai&&r.narai.text)?1:0;
    const dtp=Number(r.typing&&r.typing.score)||0;
    mathP+=dm; kanjiP+=dk; gameM+=dg; exM+=de; poolM+=dp; if(dn) naraiD++; if(dtp>bestType) bestType=dtp;
    per.kanji.push(dk); per.math.push(dm); per.game.push(dg);
    per.exercise.push(de+dp); per.narai.push(dn); per.typing.push(dtp);
  });

  // ---- 実力（下がらない）：時間土台×項目ごとの振り分け ----
  // 土台エンベロープ：序盤 ~14、終盤 ~94。時間が主・記録がすこし前倒し。
  const envelope=14 + 80*smooth(timeProg*0.82 + dFactor*0.18);
  const norm=(v,scale)=>Math.tanh(v/scale);          // 0〜約1（飽和）＝累積で単調に増える
  const share={
    kanji: norm(kanjiP,60), math: norm(mathP,55), game: norm(gameM,900),
    exercise: norm(exM+poolM,900), narai: norm(naraiD,12), typing: norm(bestType,320)
  };
  const dist=k=>0.80+0.32*share[k];                  // 取り組んだ項目ほど高い（0.80〜1.12）
  const skill={
    kanji:    R(cl(envelope*dist('kanji')*0.94,0,100)), // 漢字は後追いで少し控えめ
    math:     R(cl(envelope*dist('math')     ,0,100)),
    game:     R(cl(envelope*dist('game')     ,0,100)),
    exercise: R(cl(envelope*dist('exercise') ,0,100)),
    narai:    R(cl(envelope*dist('narai')    ,0,100)),
    typing:   R(cl(envelope*dist('typing')   ,0,100))
  };

  // ---- 調子（実力とは別に上下）：直近3日 vs これまでの平均 ----
  const delay=(typeof computeDelay==='function')?computeDelay(reports):0;
  const gPen=delay>=2?-6:(delay===1?-3:0);            // 記録が止まると全体的に調子ダウン
  const cond={};
  Object.keys(per).forEach(k=>{
    const arr=per[k]; const base=arr.length?arr.reduce((s,x)=>s+x,0)/arr.length:0;
    const rec=arr.slice(-3); const recAvg=rec.length?rec.reduce((s,x)=>s+x,0)/rec.length:0;
    let c = base<=0 ? (recAvg>0?6:0) : ((recAvg-base)/base)*14;
    cond[k]=R(cl(c+gPen,-16,12));
  });

  const vals=[skill.kanji,skill.math,skill.game,skill.exercise,skill.narai,skill.typing];
  const avg=vals.reduce((s,x)=>s+x,0)/6;
  const cvals=Object.values(cond); const condAvg=cvals.reduce((s,x)=>s+x,0)/cvals.length;

  return Object.assign(skill,{
    cond, condOverall:R(condAvg),
    overall:{ lv:R(avg), exp:R(avg) },
    _meta:{ elapsed, totalDays, days:d }
  });
}

  };
}
function rawEq(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }
function rawEmpty(f){
  if(!f) return true;
  const some=(arr,keys)=>(arr||[]).some(o=>keys.some(k=>String(o[k]||'').trim()!==''));
  return !( some(f.study,['sel','name','amt','unit'])
         || some(f.exercise,['name','min'])
         || some(f.game,['name','min'])
         || [f.pool,f.typeScore,f.typeMemo,f.narai,f.reflection].some(x=>String(x||'').trim()!=='') );
}
function isDirty(){
  if(!baseRaw) return false;
  const rep=$('#view-report');
  if(!rep || rep.classList.contains('hidden')) return false;
  return !rawEq(readFormRaw(), baseRaw);
}
function saveDraft(){
  if(!editingDate || !baseRaw) return;
  const f=readFormRaw();
  if(rawEq(f,baseRaw) || rawEmpty(f)){ LS.del(DRAFT_KEY(editingDate)); return; }
  try{ LS.set(DRAFT_KEY(editingDate), JSON.stringify({ at:new Date().toISOString(), f })); }catch(e){}
}
function loadDraft(d){ try{ const t=LS.get(DRAFT_KEY(d)); return t?JSON.parse(t):null; }catch(e){ return null; } }
function clearDraft(d){ LS.del(DRAFT_KEY(d)); }
function draftWhen(iso){
  try{ const t=new Date(iso), p=x=>String(x).padStart(2,'0');
    return (t.getMonth()+1)+'月'+t.getDate()+'日 '+p(t.getHours())+':'+p(t.getMinutes()); }catch(e){ return ''; }
}
/* ふりかえりBOXを 中身に あわせて のばす（上の行が かくれて「消えた」に 見えるのを 防ぐ） */
function autoGrow(t){
  if(!t) return;
  t.style.height='auto';
  t.style.height=(t.scrollHeight+2)+'px';
}
/* 日報の 入力を 見はる（1回だけ しかけ"る） */
function hookForm(){
  if(_formHooked) return; _formHooked=true;
  const rep=$('#view-report');
  const onChange=e=>{
    if(e && e.target && e.target.id==='reflection') autoGrow(e.target);
    clearTimeout(draftT); draftT=setTimeout(saveDraft,400);
  };
  rep.addEventListener('input', onChange);
  rep.addEventListener('change', onChange);
  // タブが うらに まわる／閉じる ときは すぐ 書き出す（スマホで 落とされても のこる）
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden'){ clearTimeout(draftT); saveDraft(); } });
  window.addEventListener('pagehide', ()=>{ clearTimeout(draftT); saveDraft(); });
  window.addEventListener('beforeunload', e=>{
    if(!isDirty()) return;
    clearTimeout(draftT); saveDraft();
    e.preventDefault(); e.returnValue='';
  });
}

function drawCalendar(){
  const label=$('#calLabel'); const grid=$('#calGrid');
  label.textContent = `${calYear} . ${String(calMonth+1).padStart(2,'0')}`;
  const first=new Date(calYear,calMonth,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const tStr=todayStr();
  let html='';
  ['日','月','火','水','木','金','土'].forEach((d,i)=>{
    html+=`<div class="dow ${i===0?'sun':''} ${i===6?'sat':''}">${d}</div>`;
  });
  for(let i=0;i<startDow;i++) html+=`<div class="cell empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const ds=ymd(new Date(calYear,calMonth,day));
    const dow=new Date(calYear,calMonth,day).getDay();
    const holi=Holidays.name(ds);
    const done=!!REPORTS[ds];
    const inVac = ds>=CONFIG.vacStart && ds<=CONFIG.vacEnd;
    let cls='cell';
    if(dow===0) cls+=' sun'; if(dow===6) cls+=' sat';
    if(holi) cls+=' holi';
    if(done) cls+=' done';
    if(ds===tStr) cls+=' today';
    if(!inVac) cls+=' out';
    html+=`<div class="${cls}" data-date="${ds}" style="--ci:${day-1}">
      <div class="dnum">${day}</div>
      ${done?'<div class="maru">〇</div>':''}
      ${holi&&!done?`<div class="holi-name">${holi.length>5?holi.slice(0,4)+'…':holi}</div>`:''}
    </div>`;
  }
  grid.innerHTML=html;
  if(calSlide && !prefersReduce()){
    grid.classList.remove('slide-l','slide-r'); void grid.offsetWidth;
    grid.classList.add(calSlide==='l'?'slide-l':'slide-r'); calSlide='';
  }
  grid.querySelectorAll('.cell[data-date]').forEach(c=>{
    c.addEventListener('click',()=>openReport(c.dataset.date));
  });
}

function currentStreak(){
  // 今日 or 昨日から さかのぼって連続記録日数
  let n=0; let d=todayDate();
  if(!REPORTS[ymd(d)]) d=addDays(d,-1); // 今日未記録なら昨日基準
  while(REPORTS[ymd(d)]){ n++; d=addDays(d,-1); }
  return n;
}

function pageOptions(sel){
  let o='<option value="">-</option>';
  for(let i=0;i<=PAGE_OPTIONS;i++) o+=`<option value="${i}" ${String(sel)===String(i)?'selected':''}>${i}</option>`;
  return o;
}
function minOptions(sel){
  let o='<option value="">-</option>';
  for(const m of MIN_OPTIONS) o+=`<option value="${m}" ${String(sel)===String(m)?'selected':''}>${m}分</option>`;
  return o;
}
/* 60分以上は「1時間」「1時間半」と読みやすく出す */
function minLabel(m){
  m=Number(m);
  if(m<60) return m+'分';
  const h=Math.floor(m/60), r=m%60;
  return h+'時間'+(r===30?'半':(r?r+'分':''));
}
/* ゲーム・アニメ(TV)用のプルダウン。
   むかしの記録が 一覧に無い数字（5分・20分など）でも 消えないように、その値だけ足して出す */
function gameMinOptions(sel){
  let o='<option value="">-</option>';
  const list=GAME_MIN_OPTIONS.slice();
  const n=Number(sel);
  if(sel!=='' && sel!=null && !isNaN(n) && list.indexOf(n)<0){ list.push(n); list.sort((a,b)=>a-b); }
  for(const m of list) o+=`<option value="${m}" ${String(sel)===String(m)?'selected':''}>${minLabel(m)}</option>`;
  return o;
}

/* 親アカ専用：この日の きろくを まるごと べつの日づけに うつす（入力ミスの修正） */
async function moveReportDate(newDate){
  if(ROLE!=='parent'){ toast('この そうさは おうちのひと だけです'); return; }
  const oldDate=editingDate;
  const src=REPORTS[oldDate];
  const disp=s=>String(s).replace(/-/g,'.');
  if(!src){ toast('この日には きろくが ありません'); return; }
  if(!newDate || !/^\d{4}-\d{2}-\d{2}$/.test(newDate)){ toast('うつす さきの 日づけを えらんでください'); return; }
  if(newDate===oldDate){ toast('同じ 日づけです'); return; }
  const msg = REPORTS[newDate]
    ? `${disp(newDate)} には すでに きろくが あります。\n上書きしますか？（その日の いまの きろくは 消えます）`
    : `${disp(oldDate)} の きろくを ${disp(newDate)} に うつします。\nよろしいですか？`;
  if(!window.confirm(msg)) return;

  const data=Object.assign({}, src, {
    date:newDate,
    movedFrom:oldDate,
    updatedAt:new Date().toISOString()
  });
  await Store.save(newDate,data);
  await Store.remove(oldDate);
  clearDraft(oldDate); baseRaw=null;
  // TOPの「やること」チェック状態も いっしょに うつす（端末保存）
  try{
    const all=JSON.parse(LS.get('sq_todos')||'{}');
    if(all[oldDate]){ all[newDate]=all[oldDate]; delete all[oldDate]; LS.set('sq_todos',JSON.stringify(all)); }
  }catch(e){}

  editingDate=newDate;
  await refresh();
  toast(`📅 ${disp(oldDate)} → ${disp(newDate)} に うつしました`);
  renderReport();
}

/* ゲーム・アニメ欄を 読む（しゅるい・なまえ・分） */
function readGameList(){
  return [...document.querySelectorAll('#gameList .study-row')].map(r=>{
    const k=r.querySelector('.g-kind'), n=r.querySelector('.g-name'), m=r.querySelector('.g-min');
    if(!k||!n||!m) return null;
    return { kind:(k.value==='anime'?'anime':'game'), name:n.value.trim(),
             minutes:(m.value===''?'':Number(m.value)) };
  }).filter(o=>o && (o.name || o.minutes!==''));
}

async function saveReportForm(){
  const readList=(sel,key)=>[...document.querySelectorAll(sel+' .study-row')].map(r=>({
    name:r.querySelector('input').value.trim(),
    [key]:r.querySelector('select').value===''?'':Number(r.querySelector('select').value)
  })).filter(o=>o.name || o[key]!=='');

  // 勉強：やること選択 or その他 の行を読む（名前・数(pages)・単位）
  // ★v1.9.0：名前が 空の行を だまって 捨てていた（＝書いた行が 消える）ので やめた。
  //   数だけ 入っている行が あるときは 保存を 止めて、その行を 光らせて 教える。
  const studyRows=[...document.querySelectorAll('#studyList .study-row')].map(r=>{
    const sel=r.querySelector('.s-sel')?r.querySelector('.s-sel').value:'';
    let name='', unit='';
    if(sel==='__other'){ name=r.querySelector('.s-name').value.trim(); unit=r.querySelector('.s-unit-in').value.trim(); }
    else if(sel!==''){ name=sel; const g=(CONFIG.goals||[]).find(x=>x.name===sel); unit=(g&&g.unit)?g.unit:''; }
    const amtRaw=r.querySelector('.s-amt').value;
    const pages = amtRaw===''?'':Number(amtRaw);
    return {name, pages, unit, sel, el:r};
  });
  const readStudy=()=>studyRows
    .filter(o=> o.name!=='' || String(o.pages)!=='')
    .map(({name,pages,unit})=>({name,pages,unit}));

  // ★v1.9.0：名前の ない行を 見つけたら 保存を 止める（消さない）
  const bad = studyRows.find(o=> o.name==='' && String(o.pages)!=='' );
  if(bad){
    bad.el.classList.add('needfix');
    try{ bad.el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){ bad.el.scrollIntoView(); }
    const focusEl = bad.el.querySelector(bad.sel==='__other' ? '.s-name' : '.s-sel');
    if(focusEl) try{ focusEl.focus(); }catch(e){}
    toast(bad.sel==='__other' ? '📖 なまえを 書いてね（消さずに まってるよ）'
                              : '📖 教科を えらんでね（消さずに まってるよ）');
    setTimeout(()=>bad.el.classList.remove('needfix'), 2800);
    return;
  }

  const data={
    date:editingDate,
    study:readStudy(),
    exercise:readList('#exList','minutes'),
    pool:$('#poolMin').value===''?'':Number($('#poolMin').value),
    typing:{ score:$('#typeScore').value===''?'':Number($('#typeScore').value), memo:$('#typeMemo').value.trim() },
    game:readGameList(),
    narai:{ text:$('#naraiText').value.trim() },
    reflection:$('#reflection').value.trim(),
    reflectionReply:lastReply,
    updatedAt:new Date().toISOString()
  };
  await Store.save(editingDate,data);
  if(typeof finaleClearCache==='function') finaleClearCache();   // v1.11.0
  clearDraft(editingDate);   // 保存できたので 書きかけは もういらない
  baseRaw=null;              // ここから先は「未保存」あつかいしない
  await refresh();
  toast('🎉 ミッション かんりょう！〇を ゲット！');
  switchView('home');
}

/* きょうの ふりかえりを AI（Claudeせんせい）に みてもらう */
// AIコメント（3つ）を 各ボックスに 表示。空は 隠す
function showAiComments(c){
  const set=(id,val)=>{ const b=$('#'+id); if(!b) return; const t=b.querySelector('.rr-text');
    b.classList.remove('loading','err');
    if(val && String(val).trim()){ t.textContent=val; b.style.display='block'; } else { b.style.display='none'; } };
  set('aiStudy', c&&c.study); set('aiActivity', c&&c.activity); set('refReplyBox', c&&c.overall);
}

async function fetchReflectionReply(){
  const text = $('#reflection').value.trim();
  const btn  = $('#getReply');
  if(!text){ toast('先に ふりかえりを 書いてね'); return; }
  if(aiRound>=2){ toast('今日は もう 2回 みてもらったよ。じゅうぶん！'); return; }
  const thisRound = aiRound + 1;
  // ★2回目（さいごの チェック）は「ふりかえり（所感）」だけを 見なおす。
  //   勉強・かつどうの コメントは 1回目の ものを のこす（むだに 書きかえない・切れない）
  const onlyOverall = thisRound >= 2;
  const prev = (lastReply && typeof lastReply==='object') ? lastReply
             : { study:'', activity:'', overall:(typeof lastReply==='string'?lastReply:'') };
  const boxes = (onlyOverall ? ['refReplyBox'] : ['aiStudy','aiActivity','refReplyBox']).map(id=>$('#'+id));
  boxes.forEach(b=>{ b.classList.remove('err'); b.classList.add('loading'); b.style.display='block'; b.querySelector('.rr-text').textContent='AIが 読んでいます…⏳'; });
  btn.disabled = true; const orig = btn.textContent; btn.textContent = 'かんがえ中…';

  // --- いまの日報の入力を すべて集める（勉強は 総数・合計・のこり日数・内容つき）---
  const goals = CONFIG.goals||[];
  const study = [...document.querySelectorAll('#studyList .study-row')].map(r=>{
    const sel=r.querySelector('.s-sel')?r.querySelector('.s-sel').value:'';
    let name='',unit='';
    if(sel==='__other'){ name=r.querySelector('.s-name').value.trim(); unit=r.querySelector('.s-unit-in').value.trim(); }
    else if(sel!==''){ name=sel; const g=goals.find(x=>x.name===sel); unit=(g&&g.unit)?g.unit:''; }
    const amt=r.querySelector('.s-amt').value;
    const g=goals.find(x=>x.name===name);
    return {name, unit, today: amt===''?'':Number(amt),
      total:(g&&g.total!==''&&g.total!=null)?Number(g.total):'', done: name?goalProgress(name):0,
      desc:(g&&g.desc)?g.desc:''};
  }).filter(o=>o.name!=='');
  const readMin=(sel)=>[...document.querySelectorAll(sel+' .study-row')].map(r=>({
    name:r.querySelector('input').value.trim(),
    minutes:r.querySelector('select').value===''?'':Number(r.querySelector('select').value)
  })).filter(o=>o.name||o.minutes!=='');
  const exercise=readMin('#exList');
  const gRows=readGameList();
  const game =gRows.filter(o=>o.kind!=='anime').map(({name,minutes})=>({name,minutes}));
  const anime=gRows.filter(o=>o.kind==='anime').map(({name,minutes})=>({name,minutes}));
  const pool = $('#poolMin').value===''?'':Number($('#poolMin').value);
  const typing = { score: $('#typeScore').value===''?'':Number($('#typeScore').value), memo: $('#typeMemo').value.trim() };
  const lessons = $('#naraiText').value.trim();
  const remainingDays = Math.max(0, diffDays(CONFIG.vacEnd, editingDate));
  /* v1.10.0：ほめるだけに しない ための 材料。
     progress＝しゅくだい ぜんたいの すすみ ／ recent＝きのうまでの7日 ／ todaySum＝今日の 合計 */
  const progress = goalSummary();
  const recent   = recentStats(editingDate, 7);
  const todaySum = {
    studyAmount: study.reduce((a,x)=>a+(Number(x.today)||0),0),
    exerciseMin: exercise.reduce((a,x)=>a+(Number(x.minutes)||0),0),
    poolMin: Number(pool)||0,
    gameMin: game.reduce((a,x)=>a+(Number(x.minutes)||0),0),
    animeMin: anime.reduce((a,x)=>a+(Number(x.minutes)||0),0),
    reflectionChars: text.length
  };

  try{
    const res = await fetch(SQ_REPLY_URL, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-SQ-Token':SQ_REPLY_TOKEN },
      body: JSON.stringify({ name:(ROLE==='child'?CHILD_ID:''), round:thisRound, only:(onlyOverall?'overall':'all'),
        remainingDays, study, exercise, pool, game, anime, typing, lessons, reflection:text,
        progress, recent, todaySum, prevReflection:(onlyOverall?aiPrevReflection:'') })
    });
    let d = {}; try{ d = await res.json(); }catch(e){}
    if(!res.ok){ throw new Error(((d && d.error) || ('エラー ' + res.status)) + ((d && d.detail) ? (' / ' + d.detail) : '')); }
    const c = d.comments || { study:'', activity:'', overall:(d.reply||'') };
    // 2回目は ふりかえり（所感）だけ 新しくして、勉強・かつどうは 1回目の ままに する
    const merged = onlyOverall
      ? { study:(c.study||prev.study||''), activity:(c.activity||prev.activity||''), overall:(c.overall||'') }
      : c;
    lastReply = merged;
    aiRound = thisRound;
    if(thisRound===1) aiPrevReflection = text;   /* 2回目に 見くらべる ための 1回目の 文 */
    showAiComments(merged);
    // 空応答・切れで 何も出せないとき、無言で 消えないように 案内を出す
    const anyShown = ['aiStudy','aiActivity','refReplyBox'].some(id=>$('#'+id).style.display!=='none');
    if(!anyShown){
      const ov=$('#refReplyBox'); ov.classList.remove('loading','err'); ov.style.display='block';
      ov.querySelector('.rr-text').textContent='うまく よみこめませんでした。もう一回 「AIに みてもらう」を おしてみてね。';
    }
    // 途中で切れた（max_tokens）ときは 親にだけ そっと知らせる（表示中のボックスに付ける）
    if(d.stop_reason==='max_tokens'){
      console.warn('[sqReply] 応答が max_tokens で 切れました');
      if(ROLE==='parent'){
        const vis=['refReplyBox','aiActivity','aiStudy'].map(id=>$('#'+id)).find(b=>b.style.display!=='none');
        if(vis){ vis.querySelector('.rr-text').textContent += '\n\n[技術情報（親のみ）] 応答が長すぎて途中で切れました（max_tokens）。'; }
      }
    }
  }catch(e){
    console.warn('[sqReply] AI呼び出し失敗:', e);
    if(!onlyOverall){ $('#aiStudy').style.display='none'; $('#aiActivity').style.display='none'; }
    const ov=$('#refReplyBox'); ov.classList.remove('loading'); ov.classList.add('err'); ov.style.display='block';
    let msg = 'ごめんね、いま おへんじが もらえませんでした。すこし まってから、もう一ど おしてね。';
    if(ROLE==='parent'){ msg += '\n\n[技術情報（親のみ表示）] ' + (e&&e.message ? e.message : String(e)); }
    ov.querySelector('.rr-text').textContent = msg;
  }finally{
    if(aiRound>=2){ btn.disabled=true; btn.textContent='✅ AIチェック ずみ'; }
    else if(aiRound===1){ btn.disabled=false; btn.textContent='🤖 直したら もう一回 みてもらう'; }
    else { btn.disabled=false; btn.textContent='🤖 AIに みてもらう'; }
  }
}

  el.innerHTML=statusPanel+`
    <div class="panel"><h2><span class="tag">STATS</span>これまでの せいせき</h2>${kpiHtml}</div>
    <div class="panel"><h2><span class="tag">01</span>べんきょうページ すいい</h2>
      <div class="chart-wrap"><canvas id="c_pages"></canvas></div>
      <div class="small-note">ぼう＝その日／せん＝つみあげ。どんどん のびると たのしいね！</div></div>

/* 写真アップロードの配線 */
function wireStatus(){
  const input=$('#photoInput'); if(!input) return;
  const pick=$('#btnPhoto'); if(pick) pick.onclick=()=>input.click();
  const cam=$('#btnPhotoCam'); if(cam) cam.onclick=openCamera;
  const del=$('#btnPhotoDel'); if(del) del.onclick=async()=>{ delete META.photo; await Store.setMeta(META); updateChipAvatar(); renderSummary(); toast('アバターを けしました'); };
  input.onchange=e=>{ const f=e.target.files[0]; if(f) handlePhoto(f); e.target.value=''; };
  const ci=$('#photoCam'); if(ci) ci.onchange=e=>{ const f=e.target.files[0]; if(f) handlePhoto(f); e.target.value=''; };
  // カメラ画面の ボタン（1回 つないでおけば OK）
  const shot=$('#camShot'), sw=$('#camSwitch'), cl=$('#camClose');
  if(shot) shot.onclick=shootCamera;
  if(cl)   cl.onclick=closeCamera;
  if(sw)   sw.onclick=async()=>{ camFacing=(camFacing==='user')?'environment':'user';
    try{ await startCam(); }catch(e){ toast('この カメラは つかえません'); camFacing=(camFacing==='user')?'environment':'user'; try{await startCam();}catch(_){ closeCamera(); } } };
}

/* ---- カメラで アバターを とる ---------------------------------------
   ・パソコン／スマホの カメラを その場で ひらいて 撮る（getUserMedia）
   ・つかえない ときは スマホの カメラアプリ、それも だめなら ファイル選択に にげる
   ・カメラは https（GitHub Pages）か localhost でしか うごかない（ブラウザの きまり） */
let camStream=null, camFacing='user';
function camFallback(){
  const ci=$('#photoCam'), input=$('#photoInput');
  if(ci) ci.click(); else if(input) input.click();
}
async function startCam(){
  stopCam();
  const video=$('#camVideo');
  camStream=await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:camFacing, width:{ideal:1280}, height:{ideal:1280} }, audio:false });
  video.srcObject=camStream;
  video.style.transform=(camFacing==='user')?'scaleX(-1)':'none';   // 自分どり は 鏡のように 見せる
  try{ await video.play(); }catch(e){}
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>{try{t.stop()}catch(e){}}); camStream=null; }
  const v=$('#camVideo'); if(v) v.srcObject=null; }
function closeCamera(){ stopCam(); const m=$('#camModal'); if(m) m.classList.add('hidden'); }
async function openCamera(){
  const modal=$('#camModal');
  if(!modal || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camFallback(); return; }
  modal.classList.remove('hidden');
  const note=$('#camNote'); if(note) note.textContent='カメラを じゅんびしています…';
  try{
    await startCam();
    if(note) note.textContent='まるの 中に 顔が 入るように してね。';
  }catch(e){
    console.warn('カメラを ひらけませんでした', e);
    closeCamera();
    const denied=(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'));
    toast(denied?'カメラの きょかが ひつようです':'カメラが つかえないので ファイルから えらんでね');
    camFallback();
  }
}
async function shootCamera(){
  const video=$('#camVideo');
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh){ toast('もう ちょっと まってね'); return; }
  // アバター枠（よこ4：たて3）に あわせて まん中を きりぬく＝見えている とおりに のこる
  const AR=4/3;
  let sw=vw, sh=vh;
  if(vw/vh > AR) sw=Math.round(vh*AR); else sh=Math.round(vw/AR);
  const sx=(vw-sw)/2, sy=(vh-sh)/2, ow=960, oh=720;
  const c=document.createElement('canvas'); c.width=ow; c.height=oh;
  const ctx=c.getContext('2d');
  if(camFacing==='user'){ ctx.translate(ow,0); ctx.scale(-1,1); }  // 見たままの 向きで のこす
  ctx.drawImage(video, sx,sy,sw,sh, 0,0,ow,oh);
  let url; try{ url=c.toDataURL('image/jpeg',0.8); }catch(e){ toast('しゃしんを 作れませんでした'); return; }
  closeCamera();
  await savePhotoSrc(url);
}
async function savePhotoSrc(url){
  META.photo=url; await Store.setMeta(META); updateChipAvatar(); renderSummary(); toast('アバターを 保存しました');
}

function handlePhoto(file){
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=async()=>{
      const max=720; let w=img.width,h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; }
      else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let url; try{ url=c.toDataURL('image/jpeg',0.72); }catch(err){ url=ev.target.result; }
      await savePhotoSrc(url);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
