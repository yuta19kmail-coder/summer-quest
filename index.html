/* ステータス演出：数字カウントアップ／レベルバー0→target／レベルアップ検知 */
function prefersReduce(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches; }
function countUp(el,to,dur){
  to=Number(to)||0; if(prefersReduce()){ el.textContent=to; return; }
  const t0=performance.now();
  const step=t=>{ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function countUpNode(node,to,dur){
  to=Number(to)||0; if(prefersReduce()){ node.textContent=to; return; }
  const t0=performance.now();
  const step=t=>{ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
    node.textContent=Math.round(to*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function readStatSnap(){ try{ return JSON.parse(LS.get('sq_stat_prev')||'null'); }catch(e){ return null; } }
function writeStatSnap(o){ try{ LS.set('sq_stat_prev', JSON.stringify(o)); }catch(e){} }
function jpAxis(k){ return {kanji:'かんじ',math:'さんすう',game:'ゲーム/アニメ',exercise:'うんどう',narai:'ならいごと',typing:'タイピング'}[k]||k; }
function animateStatus(stats){
  const reduce=prefersReduce();
  // 数字（Lv・総合Lv）
  document.querySelectorAll('#view-summary .lvn').forEach(el=>countUp(el,el.dataset.to,1700));
  // KPIの数値（先頭テキストノードだけ動かす。単位spanは残す）
  document.querySelectorAll('#view-summary .kpi .num').forEach(el=>{
    const node=el.firstChild; if(!node||node.nodeType!==3) return;
    const to=parseInt(el.textContent,10); if(isNaN(to)) return;
    countUpNode(node,to,1700);
  });
  // 総合EXPバー
  const exp=document.querySelector('#view-summary .exp-fill');
  if(exp){ const to=Number(exp.dataset.to)||0;
    if(reduce){ exp.style.width=to+'%'; } else requestAnimationFrame(()=>setTimeout(()=>{ exp.style.width=to+'%'; },60)); }
  // レベルバー：0→target（少しずつ順番に伸ばす）＋レベルアップ演出
  const prev=readStatSnap();
  const bars=[...document.querySelectorAll('#view-summary .sbar')];
  bars.forEach((bar,i)=>{
    const fill=bar.querySelector('.fill'); if(!fill) return;
    const to=Number(fill.dataset.to)||0;
    const grow=()=>{ fill.style.width=to+'%'; bar.classList.add('grown'); };
    if(reduce){ grow(); } else setTimeout(grow, 220+i*280);
    const key=bar.dataset.key;
    if(!reduce && key && prev && prev[key]!=null && to>prev[key]){
      setTimeout(()=>bar.classList.add('levelup'), 560+i*280);
    }
  });
  // スナップショット保存＋レベルアップの ひとことトースト
  const cur={}; bars.forEach(b=>{ const f=b.querySelector('.fill'); if(f) cur[b.dataset.key]=Number(f.dataset.to)||0; });
  const ups=[]; if(prev){ Object.keys(cur).forEach(k=>{ if(prev[k]!=null && cur[k]>prev[k]) ups.push(k); }); }
  writeStatSnap(cur);
  if(ups.length && !reduce) setTimeout(()=>toast('✨ '+jpAxis(ups[0])+'が レベルアップ！'), 1500);
}
/* ===== v1.7 モーション：アンビエント／押下リップル／登場演出／お祝いバースト ===== */
let _motionInit=false, calSlide='';
function initMotion(){
  if(_motionInit) return; _motionInit=true;
  if(!prefersReduce()){
    const fx=document.createElement('div'); fx.id='fx';
    fx.innerHTML='<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>';
    document.body.appendChild(fx);
  }
  document.addEventListener('pointerdown',e=>{
    if(prefersReduce()) return;
    const t=e.target.closest && e.target.closest('.btn,.addbtn,.nav button,.cal-head button,.typing-link,.del,.user-chip');
    if(!t) return;
    const r=t.getBoundingClientRect(); const d=Math.max(r.width,r.height)*1.35;
    const s=document.createElement('span'); s.className='ripple';
    s.style.width=s.style.height=d+'px';
    s.style.left=(e.clientX-r.left)+'px'; s.style.top=(e.clientY-r.top)+'px';
    t.appendChild(s); setTimeout(()=>s.remove(),1000);
  },{passive:true});
}
function enterView(view){
  if(!view||prefersReduce()) return;
  view.querySelectorAll('.panel').forEach((p,i)=>p.style.setProperty('--pi',i));
  view.querySelectorAll('.field').forEach((f,i)=>f.style.setProperty('--fi',i));
  view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
  setTimeout(()=>view.classList.remove('enter'),1900);
}
function celebrate(x,y){
  if(prefersReduce()) return;
  for(let i=0;i<16;i++){
    const s=document.createElement('div'); s.className='spark';
    const a=(Math.PI*2*i/16)+Math.random()*0.35, dist=60+Math.random()*75;
    s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(a)*dist).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*dist).toFixed(1)+'px');
    s.style.background='radial-gradient(circle,#fff,'+(i%2?'#00e5ff':'#7af5c8')+' 60%,transparent)';
    document.body.appendChild(s); setTimeout(()=>s.remove(),1500);
  }
}
/* v1.9.0：✕の 押しまちがいで 行が 消える事故を 防ぐ
   ・中身が 入っている行は「けしますか？」と きく
   ・消したあとも トーストの「↩ もどす」で 元の位置に 戻せる */
let _undoRow=null;
function rowHasContent(row){
  return [...row.querySelectorAll('input,select')].some(el=>{
    if(el.classList && el.classList.contains('g-kind')) return false;  // しゅるいは 最初から 入っている
    return String(el.value||'').trim()!=='';
  });
}
function removeRow(row,cont){
  if(cont.children.length<=1) return;
  if(rowHasContent(row)){
    if(!window.confirm('この行を けしますか？\n\n書いた ことは 消えます。')) return;
  }
  const idx=[...cont.children].indexOf(row);
  const go=()=>{
    row.classList.remove('removing');
    row.remove();
    _undoRow={row,cont,idx};
    toastUndo('1行 けしたよ', ()=>{
      if(!_undoRow) return;
      const u=_undoRow; _undoRow=null;
      if(u.idx>=0 && u.idx<u.cont.children.length) u.cont.insertBefore(u.row, u.cont.children[u.idx]);
      else u.cont.appendChild(u.row);
      if(typeof saveDraft==='function') saveDraft();
      toast('↩ もどしたよ');
    });
    if(typeof saveDraft==='function') saveDraft();
  };
  if(prefersReduce()){ go(); return; }
  row.classList.add('removing'); setTimeout(go,420);
}
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.style.pointerEvents=''; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
/* 「↩ もどす」つきトースト（v1.9.0） */
function toastUndo(msg,fn){
  const t=$('#toast');
  t.textContent='';
  const s=document.createElement('span'); s.textContent=msg; t.appendChild(s);
  const b=document.createElement('button'); b.type='button'; b.textContent='↩ もどす';
  b.style.cssText='margin-left:14px;background:rgba(4,18,26,.16);border:1px solid rgba(4,18,26,.5);'
    +'color:#04121a;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:900;cursor:pointer';
  b.onclick=()=>{ t.classList.remove('show'); t.style.pointerEvents=''; fn(); };
  t.appendChild(b);
  t.style.pointerEvents='auto';
  t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.classList.remove('show'); t.style.pointerEvents=''; },7000);
}
